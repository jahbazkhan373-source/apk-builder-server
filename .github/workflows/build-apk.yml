              private String formatDuration(long ms) {
                  if (ms <= 0) return "00:00";
                  long totalSeconds = ms / 1000;
                  long hrs = totalSeconds / 3600;
                  long mins = (totalSeconds % 3600) / 60;
                  long secs = totalSeconds % 60;
                  if (hrs > 0) {
                      return String.format(Locale.US, "%02d:%02d:%02d", hrs, mins, secs);
                  } else {
                      return String.format(Locale.US, "%02d:%02d", mins, secs);
                  }
              }

              private String getBaseName(String path) {
                  if (path == null) return "";
                  int idx = path.lastIndexOf('/');
                  return (idx >= 0 && idx < path.length() - 1) ? path.substring(idx + 1) : path;
              }

              private String getExtension(String path) {
                  if (path == null) return "unknown";
                  int idx = path.lastIndexOf('.');
                  if (idx >= 0 && idx < path.length() - 1) {
                      return path.substring(idx + 1);
                  }
                  return "unknown";
              }

              private void updateFolderTitle() {
                  String title = currentFolderFilter;
                  if ("ALL".equals(title)) {
                      title = "All Audio Files";
                  } else {
                      title = getBaseName(title);
                  }
                  if (showFavoritesOnly) title = "Favorites";
                  if (showRecentOnly) title = "Recent Playback";
                  if (showTrashOnly) title = "Trash Bin";
                  if (currentPlaylistFilter != null) title = "Playlist: " + currentPlaylistFilter;
                  if (!currentSearchQuery.isEmpty()) {
                      title = title + " (Searching: " + currentSearchQuery + ")";
                  }
                  currentFolderView.setText("Current: " + title + " (" + currentSortOrder + ")");
              }

              private void sortDisplayList() {
                  AudioItem playingItem = MediaPlaybackService.getCurrentItem();
                  String playingPath = (playingItem != null) ? playingItem.path : null;

                  Comparator<AudioItem> comparator;
                  if ("Title (Ascending)".equals(currentSortOrder) || "Name (A to Z)".equals(currentSortOrder)) {
                      comparator = (a, b) -> a.name.toLowerCase(Locale.ROOT).compareTo(b.name.toLowerCase(Locale.ROOT));
                  } else if ("Title (Descending)".equals(currentSortOrder) || "Name (Z to A)".equals(currentSortOrder)) {
                      comparator = (a, b) -> b.name.toLowerCase(Locale.ROOT).compareTo(a.name.toLowerCase(Locale.ROOT));
                  } else if ("Date (Newest First)".equals(currentSortOrder)) {
                      comparator = (a, b) -> Long.compare(b.dateAdded, a.dateAdded);
                  } else if ("Date (Oldest First)".equals(currentSortOrder)) {
                      comparator = (a, b) -> Long.compare(a.dateAdded, b.dateAdded);
                  } else if ("Size (Largest First)".equals(currentSortOrder)) {
                      comparator = (a, b) -> Long.compare(b.size, a.size);
                  } else if ("Size (Smallest First)".equals(currentSortOrder)) {
                      comparator = (a, b) -> Long.compare(a.size, b.size);
                  } else if ("Path (A to Z)".equals(currentSortOrder)) {
                      comparator = (a, b) -> a.path.toLowerCase(Locale.ROOT).compareTo(b.path.toLowerCase(Locale.ROOT));
                  } else {
                      comparator = (a, b) -> Long.compare(b.dateAdded, a.dateAdded);
                  }

                  Collections.sort(MediaPlaybackService.displayList, comparator);

                  if (playingPath != null) {
                      for (int i = 0; i < MediaPlaybackService.displayList.size(); i++) {
                          if (playingPath.equals(MediaPlaybackService.displayList.get(i).path)) {
                              MediaPlaybackService.currentIndex = i;
                              break;
                          }
                      }
                  }
              }

              private boolean isFileInPlaylist(String path, String playlistName) {
                  String listData = playlistsPrefs.getString(playlistName, "");
                  return listData.contains(path);
              }

              private boolean isFileInTrash(String path) {
                  return trashPrefs.getBoolean(path, false);
              }

              private void filterDisplayList() {
                  List<AudioItem> filtered = new ArrayList<>();
                  for (AudioItem file : audioList) {
                      boolean inFolder = "ALL".equals(currentFolderFilter) || file.path.startsWith(currentFolderFilter);
                      boolean isFav = favPrefs.getBoolean(file.path, false);
                      boolean isRecent = recentPrefs.getBoolean(file.path, false);
                      boolean inList = currentPlaylistFilter == null || isFileInPlaylist(file.path, currentPlaylistFilter);
                      boolean inTrash = isFileInTrash(file.path);
                      boolean matchSearch = currentSearchQuery.isEmpty()
                              || file.name.toLowerCase(Locale.ROOT).contains(currentSearchQuery);

                      if (showTrashOnly) {
                          if (inTrash && matchSearch) filtered.add(file);
                      } else if (!inTrash) {
                          if (inFolder && (!showFavoritesOnly || isFav)
                                  && (!showRecentOnly || isRecent)
                                  && inList && matchSearch) {
                              filtered.add(file);
                          }
                      }
                  }
                  MediaPlaybackService.displayList = filtered;
                  sortDisplayList();
              }

              private void refreshListView() {
                  filterDisplayList();
                  renderDisplayList();
                  updateFilterButtonsStyle();
              }

              private void renderDisplayList() {
                  final List<AudioItem> list = MediaPlaybackService.displayList;
                  fileCountView.setText("Total: " + list.size());
                  updateFolderTitle();

                  audioAdapter = new ArrayAdapter<AudioItem>(ctx, 0, list) {
                      @Override
                      public View getView(int position, View convertView, ViewGroup parent) {
                          AudioCardHolder holder;
                          if (convertView == null) {
                              LinearLayout card = new LinearLayout(ctx);
                              card.setOrientation(LinearLayout.VERTICAL);
                              card.setPadding(dp(12), dp(10), dp(12), dp(10));

                              TextView titleText = new TextView(ctx);
                              titleText.setTextSize(14);
                              titleText.setTypeface(null, Typeface.BOLD);
                              titleText.setMaxLines(2);
                              titleText.setEllipsize(TextUtils.TruncateAt.END);
                              card.addView(titleText);

                              TextView metaText = new TextView(ctx);
                              metaText.setTextSize(11);
                              metaText.setPadding(0, dp(4), 0, 0);
                              metaText.setSingleLine(true);
                              metaText.setEllipsize(TextUtils.TruncateAt.END);
                              card.addView(metaText);

                              holder = new AudioCardHolder();
                              holder.card = card;
                              holder.titleText = titleText;
                              holder.metaText = metaText;
                              card.setTag(holder);
                              convertView = card;
                          } else {
                              holder = (AudioCardHolder) convertView.getTag();
                          }

                          AudioItem item = list.get(position);
                          AudioItem currentItem = MediaPlaybackService.getCurrentItem();
                          boolean isCurrent = (currentItem != null && item.path.equals(currentItem.path));
                          boolean isFav = favPrefs.getBoolean(item.path, false);

                          String titleToDisplay = tagsPrefs.getString(item.path + "_title", item.name);
                          double sizeMB = item.size / (1024.0 * 1024.0);
                          String durStr = formatDuration(item.duration);
                          String fileType = getExtension(item.path).toUpperCase(Locale.ROOT);

                          String prefix = isCurrent ? "▶ " : (position + 1) + ". ";
                          String favBadge = isFav ? " ★" : "";
                          holder.titleText.setText(prefix + titleToDisplay + favBadge);
                          holder.metaText.setText(String.format(Locale.US,
                                  "Size: %.1f MB  •  Time: %s  •  %s", sizeMB, durStr, fileType));

                          if (isCurrent) {
                              holder.card.setBackground(makeCardDrawable(colorActiveCard, colorPrimary, 12, 1));
                              holder.titleText.setTextColor(colorAccent);
                              holder.metaText.setTextColor(colorTextMain);
                          } else {
                              holder.card.setBackground(makeCardDrawable(colorCard, colorBorder, 12, 1));
                              holder.titleText.setTextColor(colorTextMain);
                              holder.metaText.setTextColor(colorTextSub);
                          }

                          return convertView;
                      }
                  };

                  listView.setAdapter(audioAdapter);
                  gridView.setAdapter(audioAdapter);
              }

              private void scanAudioFiles() {
                  fileCountView.setText("Loading...");
                  new Thread(() -> {
                      final List<AudioItem> tempAudioList = new ArrayList<>();
                      try {
                          ContentResolver resolver = ctx.getContentResolver();
                          if (resolver != null) {
                              Uri uri = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI;
                              String[] projection = {"_id", "_display_name", "_data", "date_added", "_size", "duration"};
                              String sortOrder = "date_added DESC, date_modified DESC";
                              Cursor cursor = resolver.query(uri, projection, null, null, sortOrder);
                              if (cursor != null) {
                                  int dataCol = cursor.getColumnIndex("_data");
                                  int nameCol = cursor.getColumnIndex("_display_name");
                                  int dateCol = cursor.getColumnIndex("date_added");
                                  int sizeCol = cursor.getColumnIndex("_size");
                                  int durCol = cursor.getColumnIndex("duration");

                                  while (cursor.moveToNext()) {
                                      if (dataCol >= 0) {
                                          String path = cursor.getString(dataCol);
                                          String name = (nameCol >= 0) ? cursor.getString(nameCol) : "Unknown";
                                          if (name == null) name = "Unknown";
                                          long dateAdded = (dateCol >= 0) ? cursor.getLong(dateCol) : 0;
                                          long size = (sizeCol >= 0) ? cursor.getLong(sizeCol) : 0;
                                          long duration = (durCol >= 0) ? cursor.getLong(durCol) : 0;

                                          if (path != null && new File(path).exists()) {
                                              tempAudioList.add(new AudioItem(name, path, dateAdded, size, duration));
                                          }
                                      }
                                  }
                                  cursor.close();
                              }
                          }
                      } catch (Throwable ignored) {}

                      runOnUiThread(() -> {
                          audioList = tempAudioList;
                          refreshListView();

                          String lastPath = prefs.getString("lastPlayingPath", "");
                          int lastPos = prefs.getInt("pos_" + lastPath, 0);
                          String lastName = prefs.getString("lastPlayingName", "");
                          if (!lastPath.isEmpty()) {
                              for (int idx = 0; idx < MediaPlaybackService.displayList.size(); idx++) {
                                  if (lastPath.equals(MediaPlaybackService.displayList.get(idx).path)) {
                                      MediaPlaybackService.currentIndex = idx;
                                      break;
                                  }
                              }
                              if (MediaPlaybackService.mediaPlayer != null
                                      && !MediaPlaybackService.mediaPlayer.isPlaying()
                                      && lastPos > 0) {
                                  try {
                                      MediaPlaybackService.mediaPlayer.reset();
                                      MediaPlaybackService.mediaPlayer.setDataSource(lastPath);
                                      MediaPlaybackService.mediaPlayer.prepare();
                                      MediaPlaybackService.mediaPlayer.seekTo(lastPos);
                                      MediaPlaybackService.lastStatusText = "Paused: " + (!lastName.isEmpty() ? lastName : "Unknown");
                                      syncUiWithPlayer();
                                  } catch (Throwable ignored) {}
                              }
                          }
                      });
                  }).start();
              }

