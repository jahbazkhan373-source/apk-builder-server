              private void showGoToTimeDialog() {
                  if (mediaPlayer == null) return;
                  EditText input = new EditText(ctx);
                  input.setHint("hh:mm:ss or mm:ss (e.g. 01:30:00 or 15:30)");
                  new AlertDialog.Builder(ctx)
                          .setTitle("Go To Time")
                          .setView(input)
                          .setPositiveButton("Go", (d, w) -> {
                              String timeStr = input.getText().toString().trim();
                              int millis = 0;
                              Matcher m3 = Pattern.compile("(\\d+):(\\d+):(\\d+)").matcher(timeStr);
                              if (m3.find()) {
                                  int h = Integer.parseInt(m3.group(1));
                                  int m = Integer.parseInt(m3.group(2));
                                  int s = Integer.parseInt(m3.group(3));
                                  millis = ((h * 3600) + (m * 60) + s) * 1000;
                              } else {
                                  Matcher m2 = Pattern.compile("(\\d+):(\\d+)").matcher(timeStr);
                                  if (m2.find()) {
                                      int m = Integer.parseInt(m2.group(1));
                                      int s = Integer.parseInt(m2.group(2));
                                      millis = ((m * 60) + s) * 1000;
                                  }
                              }

                              if (millis > 0) {
                                  try {
                                      if (millis <= mediaPlayer.getDuration()) {
                                          mediaPlayer.seekTo(millis);
                                          seekBar.setProgress(millis);
                                          timeCurrent.setText(formatDuration(millis));
                                      } else {
                                          Toast.makeText(ctx, "Time exceeds audio duration", Toast.LENGTH_SHORT).show();
                                      }
                                  } catch (Throwable ignored) {}
                              } else {
                                  Toast.makeText(ctx, "Invalid format. Use hh:mm:ss or mm:ss", Toast.LENGTH_SHORT).show();
                              }
                          })
                          .setNegativeButton("Cancel", null)
                          .show();
              }

              private void handleABRepeat() {
                  if (mediaPlayer == null) return;
                  try {
                      if (abRepeatState == 0) {
                          abPointA = mediaPlayer.getCurrentPosition();
                          abRepeatState = 1;
                          btnABRepeat.setText("A-B (A Set)");
                          Toast.makeText(ctx, "Point A set", Toast.LENGTH_SHORT).show();
                      } else if (abRepeatState == 1) {
                          abPointB = mediaPlayer.getCurrentPosition();
                          if (abPointB > abPointA) {
                              abRepeatState = 2;
                              btnABRepeat.setText("A-B (Active)");
                              Toast.makeText(ctx, "Point B set. Repeating...", Toast.LENGTH_SHORT).show();
                          } else {
                              Toast.makeText(ctx, "Point B must be after A", Toast.LENGTH_SHORT).show();
                              abRepeatState = 0;
                              btnABRepeat.setText("A-B Repeat");
                          }
                      } else {
                          abRepeatState = 0;
                          btnABRepeat.setText("A-B Repeat");
                          Toast.makeText(ctx, "A-B Repeat Cleared", Toast.LENGTH_SHORT).show();
                      }
                  } catch (Throwable ignored) {}
              }

