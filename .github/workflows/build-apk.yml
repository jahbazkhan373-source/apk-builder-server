              private void openFeedbackDialog() {
                  ScrollView scroll = new ScrollView(ctx);
                  scroll.setBackgroundColor(colorCard);
                  LinearLayout layout = new LinearLayout(ctx);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(dp(20), dp(20), dp(20), dp(20));

                  TextView title = new TextView(ctx);
                  title.setText("Send Feedback to Developer");
                  title.setTextSize(18);
                  title.setTypeface(null, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  title.setTextColor(colorAccent);
                  title.setPadding(0, 0, 0, dp(14));
                  layout.addView(title);

                  LinearLayout.LayoutParams fieldLp = new LinearLayout.LayoutParams(-1, -2);
                  fieldLp.bottomMargin = dp(10);

                  EditText editAppName = new EditText(ctx);
                  styleEditText(editAppName, null);
                  editAppName.setText("App: MJ Audio Player");
                  editAppName.setEnabled(false);
                  editAppName.setTextColor(colorTextSub);
                  editAppName.setLayoutParams(fieldLp);
                  layout.addView(editAppName);

                  final EditText editName = new EditText(ctx);
                  styleEditText(editName, "Enter Name");
                  editName.setLayoutParams(fieldLp);
                  layout.addView(editName);

                  final EditText editWa = new EditText(ctx);
                  styleEditText(editWa, "WhatsApp Number (Optional)");
                  editWa.setInputType(InputType.TYPE_CLASS_PHONE);
                  editWa.setLayoutParams(fieldLp);
                  layout.addView(editWa);

                  final EditText editMsg = new EditText(ctx);
                  styleEditText(editMsg, "Enter Feedback Message");
                  editMsg.setMinLines(3);
                  editMsg.setGravity(Gravity.TOP);
                  editMsg.setLayoutParams(fieldLp);
                  layout.addView(editMsg);

                  Button btnSend = createDialogMenuButton("SEND FEEDBACK", colorPrimary, colorPrimaryDark, colorAccent, Color.WHITE);
                  layout.addView(btnSend);

                  Button btnBack = createDialogMenuButton("GO BACK", colorDanger, colorDangerDark, colorDanger, Color.WHITE);
                  layout.addView(btnBack);

                  scroll.addView(layout);
                  final AlertDialog mainDialog = themedDialog().setView(scroll).create();
                  mainDialog.show();

                  btnBack.setOnClickListener(v -> mainDialog.dismiss());

                  btnSend.setOnClickListener(v -> {
                      final String name = editName.getText().toString();
                      final String wa = editWa.getText().toString();
                      final String msg = editMsg.getText().toString();
                      if (msg.isEmpty()) {
                          Toast.makeText(ctx, "Please enter feedback message", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      if (msg.length() > 5000) {
                          Toast.makeText(ctx, "Feedback message exceeds 5000 characters limit", Toast.LENGTH_SHORT).show();
                          return;
                      }

                      final String botToken = FeedbackConfig.getA();
                      final String chatId = FeedbackConfig.getB();
                      final String apiUrl = FeedbackConfig.getC();
                      if (botToken.isEmpty() || chatId.isEmpty() || apiUrl.isEmpty()) {
                          Toast.makeText(ctx, "Feedback secrets not set in GitHub Actions.", Toast.LENGTH_LONG).show();
                          return;
                      }

                      final ProgressDialog pd = new ProgressDialog(ctx, getDialogThemeRes());
                      pd.setMessage("Sending please wait...");
                      pd.setCancelable(false);
                      pd.show();

                      new Thread(() -> {
                          int responseCode = -1;
                          try {
                              StringBuilder fullText = new StringBuilder();
                              fullText.append("New Feedback Received:\nApp: MJ Audio Player\nName: ")
                                      .append(!name.isEmpty() ? name : "Anonymous");
                              if (!wa.isEmpty()) {
                                  fullText.append("\nWhatsApp: ").append(wa);
                              }
                              fullText.append("\nFeedback: ").append(msg);

                              String postData = "bot_token=" + URLEncoder.encode(botToken, "UTF-8")
                                      + "&chat_id=" + URLEncoder.encode(chatId, "UTF-8")
                                      + "&text=" + URLEncoder.encode(fullText.toString(), "UTF-8");

                              URL url = new URL(apiUrl);
                              HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                              conn.setRequestMethod("POST");
                              conn.setDoOutput(true);
                              conn.setConnectTimeout(15000);
                              conn.setReadTimeout(15000);
                              conn.setRequestProperty("Content-Type", "application/x-www-form-urlencoded; charset=UTF-8");

                              byte[] outBytes = postData.getBytes(StandardCharsets.UTF_8);
                              try (OutputStream os = conn.getOutputStream()) {
                                  os.write(outBytes);
                              }
                              responseCode = conn.getResponseCode();
                              conn.disconnect();
                          } catch (Throwable ignored) {}

                          final int finalCode = responseCode;
                          runOnUiThread(() -> {
                              try { pd.dismiss(); } catch (Throwable ignored) {}
                              if (finalCode == 200) {
                                  Toast.makeText(ctx, "Feedback sent successfully", Toast.LENGTH_SHORT).show();
                                  editMsg.setText("");
                                  showSuccessDialog(mainDialog);
                              } else {
                                  Toast.makeText(ctx, "Failed to send. Error: " + (finalCode > 0 ? finalCode : "Unknown"), Toast.LENGTH_LONG).show();
                              }
                          });
                      }).start();
                  });
              }

              private String getSkipText() {
                  int sd = MediaPlaybackService.skipDuration;
                  if (sd == 300000) return "Skip Time: 5 minutes";
                  else if (sd == 120000) return "Skip Time: 2 minutes";
                  else if (sd == 60000) return "Skip Time: 1 minute";
                  else return "Skip Time: " + (sd / 1000) + " seconds";
              }

