              private boolean onAudioItemLongClick(int position) {
                  if (position < 0 || position >= MediaPlaybackService.displayList.size()) return true;
                  final AudioItem item = MediaPlaybackService.displayList.get(position);
                  final boolean isFav = favPrefs.getBoolean(item.path, false);
                  final boolean inTrash = isFileInTrash(item.path);

                  final String[] options;
                  if (inTrash) {
                      options = new String[]{"Restore Audio", "Delete Permanently"};
                  } else {
                      options = new String[]{
                              "File Info",
                              isFav ? "Remove Favorite" : "Add to Favorites",
                              "Share Audio",
                              "Rename Audio",
                              "Edit Tags (Title/Artist)",
                              "Add to Playlist",
                              "Delete Audio (To Trash)"
                      };
                  }

                  themedDialog()
                          .setTitle(tagsPrefs.getString(item.path + "_title", item.name))
                          .setItems(options, (dialog, which) -> {
                              if (inTrash) {
                                  if (which == 0) {
                                      trashPrefs.edit().remove(item.path).apply();
                                      Toast.makeText(ctx, "Audio Restored", Toast.LENGTH_SHORT).show();
                                      refreshListView();
                                  } else if (which == 1) {
                                      File f = new File(item.path);
                                      if (f.delete()) {
                                          rescanPath(item.path);
                                          trashPrefs.edit().remove(item.path).apply();
                                          Toast.makeText(ctx, "Deleted Permanently", Toast.LENGTH_SHORT).show();
                                          scanAudioFiles();
                                      } else {
                                          Toast.makeText(ctx, "Failed to delete", Toast.LENGTH_SHORT).show();
                                      }
                                  }
                              } else {
                                  if (which == 0) { // Info
                                      String ext = getExtension(item.path);
                                      long durMs = item.duration;
                                      MediaMetadataRetriever mmr = new MediaMetadataRetriever();
                                      try {
                                          mmr.setDataSource(item.path);
                                          String durationStr = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION);
                                          if (durationStr != null) durMs = Long.parseLong(durationStr);
                                      } catch (Throwable ignored) {
                                      } finally {
                                          try { mmr.release(); } catch (Throwable ignored) {}
                                      }
                                      double sizeMB = item.size / (1024.0 * 1024.0);
                                      String infoMsg = "Name: " + item.name
                                              + "\n\nFormat: " + ext.toUpperCase(Locale.ROOT)
                                              + "\n\nSize: " + String.format(Locale.US, "%.2f MB", sizeMB)
                                              + "\n\nDuration: " + formatDuration(durMs);
                                      themedDialog()
                                              .setTitle("Audio Info")
                                              .setMessage(infoMsg)
                                              .setPositiveButton("OK", null)
                                              .show();
                                  } else if (which == 1) { // Favorite
                                      if (isFav) {
                                          favPrefs.edit().remove(item.path).apply();
                                          Toast.makeText(ctx, "Removed from Favorites", Toast.LENGTH_SHORT).show();
                                      } else {
                                          favPrefs.edit().putBoolean(item.path, true).apply();
                                          Toast.makeText(ctx, "Added to Favorites", Toast.LENGTH_SHORT).show();
                                      }
                                      refreshListView();
                                  } else if (which == 2) { // Share
                                      try {
                                          StrictMode.VmPolicy.Builder builder = new StrictMode.VmPolicy.Builder();
                                          StrictMode.setVmPolicy(builder.build());
                                          Intent shareIntent = new Intent(Intent.ACTION_SEND);
                                          shareIntent.setType("audio/*");
                                          shareIntent.putExtra(Intent.EXTRA_STREAM, Uri.parse("file://" + item.path));
                                          shareIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                          ctx.startActivity(Intent.createChooser(shareIntent, "Share Audio via:"));
                                      } catch (Throwable ignored) {}
                                  } else if (which == 3) { // Rename
                                      LinearLayout wrap = new LinearLayout(ctx);
                                      wrap.setPadding(dp(20), dp(12), dp(20), dp(4));
                                      EditText renameInput = new EditText(ctx);
                                      styleEditText(renameInput, "Audio file name");
                                      int dotIdx = item.name.lastIndexOf('.');
                                      String baseName = (dotIdx > 0) ? item.name.substring(0, dotIdx) : item.name;
                                      renameInput.setText(baseName);
                                      renameInput.setLayoutParams(new LinearLayout.LayoutParams(-1, -2));
                                      wrap.addView(renameInput);

                                      themedDialog()
                                              .setTitle("Rename Audio")
                                              .setView(wrap)
                                              .setPositiveButton("Save", (d, w) -> {
                                                  String newName = renameInput.getText().toString();
                                                  if (!newName.isEmpty()) {
                                                      int pDot = item.path.lastIndexOf('.');
                                                      String ext = (pDot >= 0) ? item.path.substring(pDot) : "";
                                                      File oldFile = new File(item.path);
                                                      File newFile = new File(oldFile.getParent(), newName + ext);
                                                      if (oldFile.renameTo(newFile)) {
                                                          rescanPath(oldFile.getAbsolutePath());
                                                          rescanPath(newFile.getAbsolutePath());
                                                          Toast.makeText(ctx, "Audio Renamed!", Toast.LENGTH_SHORT).show();
                                                          scanAudioFiles();
                                                      } else {
                                                          Toast.makeText(ctx, "Rename failed. Storage permission required.", Toast.LENGTH_LONG).show();
                                                      }
                                                  }
                                              })
                                              .setNegativeButton("Cancel", null)
                                              .show();
                                  } else if (which == 4) { // Edit Tags
                                      LinearLayout wrap = new LinearLayout(ctx);
                                      wrap.setPadding(dp(20), dp(12), dp(20), dp(4));
                                      EditText tagInput = new EditText(ctx);
                                      styleEditText(tagInput, "Display title");
                                      tagInput.setText(tagsPrefs.getString(item.path + "_title", item.name));
                                      tagInput.setLayoutParams(new LinearLayout.LayoutParams(-1, -2));
                                      wrap.addView(tagInput);

                                      themedDialog()
                                              .setTitle("Edit Display Title")
                                              .setView(wrap)
                                              .setPositiveButton("Save", (d, w) -> {
                                                  String newTag = tagInput.getText().toString();
                                                  if (!newTag.isEmpty()) {
                                                      tagsPrefs.edit().putString(item.path + "_title", newTag).apply();
                                                      Toast.makeText(ctx, "Title Updated", Toast.LENGTH_SHORT).show();
                                                      refreshListView();
                                                  }
                                              })
                                              .setNegativeButton("Cancel", null)
                                              .show();
                                  } else if (which == 5) { // Add to Playlist
                                      String allPlaylistsStr = playlistsPrefs.getString("all_playlists", "");
                                      final List<String> pList = new ArrayList<>();
                                      for (String pName : allPlaylistsStr.split("\\|")) {
                                          if (!pName.isEmpty()) pList.add(pName);
                                      }
                                      if (pList.isEmpty()) {
                                          Toast.makeText(ctx, "No playlists created yet. Create one first.", Toast.LENGTH_SHORT).show();
                                      } else {
                                          themedDialog()
                                                  .setTitle("Select Playlist")
                                                  .setItems(pList.toArray(new String[0]), (d, w) -> {
                                                      String pName = pList.get(w);
                                                      String currData = playlistsPrefs.getString(pName, "");
                                                      if (!currData.contains(item.path)) {
                                                          playlistsPrefs.edit().putString(pName, currData + item.path + "|").apply();
                                                          Toast.makeText(ctx, "Added to " + pName, Toast.LENGTH_SHORT).show();
                                                      } else {
                                                          Toast.makeText(ctx, "Already in playlist", Toast.LENGTH_SHORT).show();
                                                      }
                                                  })
                                                  .show();
                                      }
                                  } else if (which == 6) { // Move to Trash
                                      trashPrefs.edit().putBoolean(item.path, true).apply();
                                      Toast.makeText(ctx, "Moved to Trash Bin", Toast.LENGTH_SHORT).show();
                                      refreshListView();
                                  }
                              }
                          })
                          .show();
                  return true;
              }

              private void showEqPresets() {
