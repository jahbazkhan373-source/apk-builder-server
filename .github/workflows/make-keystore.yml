name: Make Keystore
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Make Keystore
        run: |
          keytool -genkeypair -v -keystore my-release-key.jks -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Ahmed, OU=App, O=MyApp, L=Faisalabad, ST=Punjab, C=PK"
      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: my-keystore
          path: my-release-key.jks