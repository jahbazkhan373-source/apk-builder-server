              private void showGoToTimeDialog() {
                  if (MediaPlaybackService.mediaPlayer == null) return;
                  LinearLayout wrap = new LinearLayout(ctx);
                  wrap.setPadding(dp(20), dp(12), dp(20), dp(4));
                  EditText input = new EditText(ctx);
                  styleEditText(input, "hh:mm:ss or mm:ss (e.g. 01:30:00 or 15:30)");
                  input.setLayoutParams(new LinearLayout.LayoutParams(-1, -2));
                  wrap.addView(input);

                  themedDialog()
                          .setTitle("Go To Time")
                          .setView(wrap)
                          .setPositiveButton("Go", (d, w) -> {
                              String timeStr = input.getText().toString().trim();
                              int millis = 0;
                              Matcher m3 = Pattern.compile("(\\d+):(\\d+):(\\d+)").matcher(timeStr);
                              if (m3.find()) {
                                  int h = Integer.parseInt(m3.group(1));
                                  int m = Integer.parseInt(m3.group(2));
                                  int s = Integer.parseInt(m3.group(3));
                                  millis = ((h * 3600) + (m * 60) + s) * 1000;
                              } else {
                                  Matcher m2 = Pattern.compile("(\\d+):(\\d+)").matcher(timeStr);
                                  if (m2.find()) {
                                      int m = Integer.parseInt(m2.group(1));
                                      int s = Integer.parseInt(m2.group(2));
                                      millis = ((m * 60) + s) * 1000;
                                  }
                              }

                              if (millis > 0) {
                                  try {
                                      if (millis <= MediaPlaybackService.mediaPlayer.getDuration()) {
                                          MediaPlaybackService.seekToPosition(ctx, millis);
                                          seekBar.setProgress(millis);
                                          timeCurrent.setText(formatDuration(millis));
                                      } else {
                                          Toast.makeText(ctx, "Time exceeds audio duration", Toast.LENGTH_SHORT).show();
                                      }
                                  } catch (Throwable ignored) {}
                              } else {
                                  Toast.makeText(ctx, "Invalid format. Use hh:mm:ss or mm:ss", Toast.LENGTH_SHORT).show();
                              }
                          })
                          .setNegativeButton("Cancel", null)
                          .show();
              }

              private void handleABRepeat() {
                  if (MediaPlaybackService.mediaPlayer == null) return;
                  try {
                      if (MediaPlaybackService.abRepeatState == 0) {
                          MediaPlaybackService.abPointA = MediaPlaybackService.mediaPlayer.getCurrentPosition();
                          MediaPlaybackService.abRepeatState = 1;
                          Toast.makeText(ctx, "Point A set", Toast.LENGTH_SHORT).show();
                      } else if (MediaPlaybackService.abRepeatState == 1) {
                          MediaPlaybackService.abPointB = MediaPlaybackService.mediaPlayer.getCurrentPosition();
                          if (MediaPlaybackService.abPointB > MediaPlaybackService.abPointA) {
                              MediaPlaybackService.abRepeatState = 2;
                              Toast.makeText(ctx, "Point B set. Repeating...", Toast.LENGTH_SHORT).show();
                          } else {
                              Toast.makeText(ctx, "Point B must be after A", Toast.LENGTH_SHORT).show();
                              MediaPlaybackService.abRepeatState = 0;
                          }
                      } else {
                          MediaPlaybackService.abRepeatState = 0;
                          Toast.makeText(ctx, "A-B Repeat Cleared", Toast.LENGTH_SHORT).show();
                      }
                      syncUiWithPlayer();
                  } catch (Throwable ignored) {}
              }

