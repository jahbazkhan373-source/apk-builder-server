              private void showCustomEqDialog() {
                  LinearLayout layout = new LinearLayout(ctx);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(20, 20, 20, 20);

                  final SeekBar[] seekBars = new SeekBar[5];
                  for (int i = 0; i < 5; i++) {
                      TextView label = new TextView(ctx);
                      label.setText("Band " + (i + 1));
                      layout.addView(label);
                      SeekBar sb = new SeekBar(ctx);
                      sb.setMax(3000);
                      sb.setProgress(customEqBands[i] + 1500);
                      layout.addView(sb);
                      seekBars[i] = sb;
                  }

                  new AlertDialog.Builder(ctx)
                          .setTitle("Custom Equalizer")
                          .setView(layout)
                          .setPositiveButton("Apply", (d, w) -> {
                              SharedPreferences.Editor ed = prefs.edit();
                              for (int i = 0; i < 5; i++) {
                                  customEqBands[i] = seekBars[i].getProgress() - 1500;
                                  ed.putInt("custEqBand" + (i + 1), customEqBands[i]);
                              }
                              ed.apply();
                              currentVoiceEffect = "Custom";
                              currentEqPreset = -1;
                              if (isPlaying) applyVoiceAndSpeed();
                              Toast.makeText(ctx, "Custom Equalizer Applied", Toast.LENGTH_SHORT).show();
                          })
                          .setNegativeButton("Cancel", null)
                          .show();
              }

              private void applyVoiceAndSpeed() {
                  try {
                      if (Build.VERSION.SDK_INT >= 23 && mediaPlayer != null && mediaPlayer.isPlaying()) {
                          int sessionId = mediaPlayer.getAudioSessionId();
                          try { if (globalEq != null) globalEq.setEnabled(false); } catch (Throwable ignored) {}
                          try { if (globalBass != null) globalBass.setEnabled(false); } catch (Throwable ignored) {}
                          try { if (globalVirt != null) globalVirt.setEnabled(false); } catch (Throwable ignored) {}
                          try { if (globalLoudness != null) globalLoudness.setEnabled(false); } catch (Throwable ignored) {}

                          String e = currentVoiceEffect;
                          float targetPitch = 1.0f;
                          float speedMultiplier = 1.0f;
                          int[] eqBands = null;
                          int useBass = 0;
                          int useVirt = 0;
                          int echoDelay = 0;
                          float echoVol = 0.0f;

                          if ("Custom".equals(e)) { eqBands = customEqBands; }
                          else if ("Baby".equals(e)) { targetPitch = 1.45f; eqBands = new int[]{-1000, -500, 500, 1200, 1500}; }
                          else if ("Chipmunk".equals(e)) { targetPitch = 1.8f; eqBands = new int[]{-1500, 0, 800, 1500, 1500}; }
                          else if ("Helium".equals(e)) { targetPitch = 1.95f; }
                          else if ("Bee".equals(e)) { targetPitch = 2.1f; eqBands = new int[]{-1500, -1500, 1000, 1500, 1500}; }
                          else if ("Female".equals(e)) { targetPitch = 1.35f; eqBands = new int[]{-1500, -600, 900, 1500, 1200}; }
                          else if ("Male".equals(e)) { targetPitch = 0.80f; eqBands = new int[]{1200, 800, 0, -600, -1000}; }
                          else if ("Deep / Monster".equals(e)) { targetPitch = 0.62f; useBass = 1000; eqBands = new int[]{1500, 1200, -500, -1200, -1500}; }
                          else if ("Zombie".equals(e)) { targetPitch = 0.55f; speedMultiplier = 0.85f; eqBands = new int[]{1500, 800, -800, -1500, -1500}; }
                          else if ("Alien".equals(e)) { targetPitch = 1.35f; useVirt = 1000; eqBands = new int[]{-1500, 1500, -1500, 1500, -1500}; }
                          else if ("Robot".equals(e)) { targetPitch = 0.90f; useVirt = 1000; eqBands = new int[]{-1500, 1500, 1500, -1500, -1500}; }
                          else if ("Telephone".equals(e)) { targetPitch = 1.06f; eqBands = new int[]{-1500, -1200, 1500, -1200, -1500}; }
                          else if ("Old Radio".equals(e)) { targetPitch = 1.08f; speedMultiplier = 1.03f; eqBands = new int[]{-1500, 1200, 1500, -1000, -1500}; }
                          else if ("Cave".equals(e)) { targetPitch = 0.88f; useVirt = 1000; useBass = 1000; eqBands = new int[]{1500, 1000, -400, -1000, -1500}; }
                          else if ("Cathedral".equals(e)) { targetPitch = 0.94f; useVirt = 1000; useBass = 700; eqBands = new int[]{1200, 500, -500, 800, 1500}; }
                          else if ("Grand Canyon".equals(e)) { targetPitch = 0.92f; useVirt = 1000; useBass = 800; eqBands = new int[]{1400, 400, -600, 600, 1400}; }
                          else if ("Echo".equals(e)) { targetPitch = 1.0f; useVirt = 1000; eqBands = new int[]{600, 0, -400, 600, 1200}; echoDelay = 180; echoVol = 0.55f; }
                          else if ("Bathroom".equals(e)) { targetPitch = 1.04f; useVirt = 1000; eqBands = new int[]{-1200, 1400, 1200, -800, -1200}; }
                          else if ("Echo plus".equals(e)) { targetPitch = 0.96f; useVirt = 1000; useBass = 800; eqBands = new int[]{1200, 0, -500, 800, 1500}; echoDelay = 280; echoVol = 0.70f; }
                          else if ("Bass Boost".equals(e)) { targetPitch = 0.86f; useBass = 1000; eqBands = new int[]{1500, 1500, 200, -1200, -1500}; }
                          else if ("Treble Boost".equals(e)) { targetPitch = 1.15f; eqBands = new int[]{-1500, -1200, 400, 1500, 1500}; }
                          else if ("Mid Boost".equals(e)) { targetPitch = 1.08f; eqBands = new int[]{-1500, 800, 1500, 800, -1500}; }
                          else if ("Megaphone / BullHorn".equals(e)) { targetPitch = 1.14f; eqBands = new int[]{-1500, -1000, 1500, 1500, -1500}; }
                          else if ("Underwater".equals(e)) { targetPitch = 0.82f; useBass = 1000; eqBands = new int[]{1500, 800, -1500, -1500, -1500}; }
                          else if ("Dark Vader".equals(e)) { targetPitch = 0.68f; useBass = 800; useVirt = 800; eqBands = new int[]{1500, 1000, -500, -1000, -1500}; }
                          else if ("Dragon".equals(e)) { targetPitch = 0.52f; useBass = 1000; eqBands = new int[]{1500, 1200, 0, -1200, -1500}; }
                          else if ("Drunk".equals(e)) { targetPitch = 0.82f; speedMultiplier = 0.78f; }
                          else if ("Shrinking".equals(e)) { targetPitch = 1.65f; speedMultiplier = 1.15f; }
                          else if ("Battery Low".equals(e)) { targetPitch = 0.72f; speedMultiplier = 0.72f; }

                          float finalSpeed = Math.max(0.25f, Math.min(3.0f, currentPlaybackSpeed * speedMultiplier));
                          PlaybackParams params = mediaPlayer.getPlaybackParams();
                          params.setSpeed(finalSpeed);
                          params.setPitch(targetPitch);
                          mediaPlayer.setPlaybackParams(params);

                          if (eqBands != null) {
                              try {
                                  if (globalEq == null) globalEq = new Equalizer(0, sessionId);
                                  globalEq.setEnabled(true);
                                  short numBands = globalEq.getNumberOfBands();
                                  for (short i = 0; i < numBands; i++) {
                                      int idx = Math.min(eqBands.length - 1, i);
                                      short lvl = (short) eqBands[idx];
                                      try { globalEq.setBandLevel(i, lvl); } catch (Throwable ignored) {}
                                  }
                              } catch (Throwable ignored) {}
                          } else if (currentEqPreset >= 0) {
                              try {
                                  if (globalEq == null) globalEq = new Equalizer(0, sessionId);
                                  globalEq.setEnabled(true);
                                  globalEq.usePreset((short) currentEqPreset);
                              } catch (Throwable ignored) {}
                          }

                          if (useBass > 0) {
                              try {
                                  if (globalBass == null) globalBass = new BassBoost(0, sessionId);
                                  globalBass.setEnabled(true);
                                  globalBass.setStrength((short) useBass);
                              } catch (Throwable ignored) {}
                          }

                          if (useVirt > 0) {
                              try {
                                  if (globalVirt == null) globalVirt = new Virtualizer(0, sessionId);
                                  globalVirt.setEnabled(true);
                                  globalVirt.setStrength((short) useVirt);
                              } catch (Throwable ignored) {}
                          }

                          if (volumeBoostLevel > 0) {
                              try {
                                  if (globalLoudness == null) globalLoudness = new LoudnessEnhancer(sessionId);
                                  globalLoudness.setTargetGain(volumeBoostLevel * 100);
                                  globalLoudness.setEnabled(true);
                              } catch (Throwable ignored) {}
                          }

                          syncEchoPlayer(echoDelay, echoVol, finalSpeed, targetPitch);
                      }
                  } catch (Throwable ignored) {}
              }

              private void scanAudioFiles() {
                  fileCountView.setText("Loading Audio... Please Wait");
                  new Thread(() -> {
                      final List<AudioItem> tempAudioList = new ArrayList<>();
                      try {
                          ContentResolver resolver = ctx.getContentResolver();
                          if (resolver != null) {
                              Uri uri = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI;
                              String[] projection = {"_id", "_display_name", "_data", "date_added", "_size", "duration"};
                              String sortOrder = "date_added DESC, date_modified DESC";
                              Cursor cursor = resolver.query(uri, projection, null, null, sortOrder);
                              if (cursor != null) {
                                  int dataCol = cursor.getColumnIndex("_data");
                                  int nameCol = cursor.getColumnIndex("_display_name");
                                  int dateCol = cursor.getColumnIndex("date_added");
                                  int sizeCol = cursor.getColumnIndex("_size");
                                  int durCol = cursor.getColumnIndex("duration");

                                  while (cursor.moveToNext()) {
                                      if (dataCol >= 0) {
                                          String path = cursor.getString(dataCol);
                                          String name = (nameCol >= 0) ? cursor.getString(nameCol) : "Unknown";
                                          if (name == null) name = "Unknown";
                                          long dateAdded = (dateCol >= 0) ? cursor.getLong(dateCol) : 0;
                                          long size = (sizeCol >= 0) ? cursor.getLong(sizeCol) : 0;
                                          long duration = (durCol >= 0) ? cursor.getLong(durCol) : 0;

                                          if (path != null && new File(path).exists()) {
                                              tempAudioList.add(new AudioItem(name, path, dateAdded, size, duration));
                                          }
                                      }
                                  }
                                  cursor.close();
                              }
                          }
                      } catch (Throwable ignored) {}

                      runOnUiThread(() -> {
                          audioList = tempAudioList;
                          displayList = new ArrayList<>(audioList);
                          refreshListView();

                          String lastPath = prefs.getString("lastPlayingPath", "");
                          int lastPos = prefs.getInt("pos_" + lastPath, 0);
                          String lastName = prefs.getString("lastPlayingName", "");
                          if (!lastPath.isEmpty()) {
                              for (int idx = 0; idx < displayList.size(); idx++) {
                                  if (lastPath.equals(displayList.get(idx).path)) {
                                      currentIndex = idx;
                                      break;
                                  }
                              }
                              if (mediaPlayer != null && !mediaPlayer.isPlaying() && lastPos > 0) {
                                  try {
                                      mediaPlayer.reset();
                                      mediaPlayer.setDataSource(lastPath);
                                      mediaPlayer.prepare();
                                      mediaPlayer.seekTo(lastPos);
                                      btnSpeed.setText("Speed: " + currentPlaybackSpeed + "x");
                                      trackStatusView.setText("Paused: " + (!lastName.isEmpty() ? lastName : "Unknown"));
                                      seekBar.setMax(mediaPlayer.getDuration());
                                      seekBar.setProgress(lastPos);
                                      timeTotal.setText(formatDuration(mediaPlayer.getDuration()));
                                      timeCurrent.setText(formatDuration(lastPos));
                                  } catch (Throwable ignored) {}
                              }
                          }
                      });
                  }).start();
              }

              private void playAudioAtIndex(int index) {
                  if (index < 0 || index >= displayList.size()) return;

                  if (currentIndex >= 0 && currentIndex < displayList.size() && mediaPlayer != null) {
                      try {
                          if (isPlaying || mediaPlayer.getCurrentPosition() > 0) {
                              prefs.edit().putInt("pos_" + displayList.get(currentIndex).path,
                                      mediaPlayer.getCurrentPosition()).apply();
                          }
                      } catch (Throwable ignored) {}
                  }

                  if (index == currentIndex && mediaPlayer != null) {
                      try {
                          if (!mediaPlayer.isPlaying()) {
                              mediaPlayer.start();
                              applyVoiceAndSpeed();
                              isPlaying = true;
                              btnPlayPause.setText("Pause");
                              updateNotification(displayList.get(currentIndex), true);
                          }
                      } catch (Throwable ignored) {}
                      return;
                  }

                  currentIndex = index;
                  AudioItem item = displayList.get(currentIndex);

                  recentPrefs.edit().putBoolean(item.path, true).apply();
                  btnSpeed.setText("Speed: " + currentPlaybackSpeed + "x");

                  try {
                      stopEchoPlayer();
                      try { if (globalEq != null) { globalEq.release(); globalEq = null; } } catch (Throwable ignored) {}
                      try { if (globalBass != null) { globalBass.release(); globalBass = null; } } catch (Throwable ignored) {}
                      try { if (globalVirt != null) { globalVirt.release(); globalVirt = null; } } catch (Throwable ignored) {}
                      try { if (globalLoudness != null) { globalLoudness.release(); globalLoudness = null; } } catch (Throwable ignored) {}

                      mediaPlayer.reset();
                      mediaPlayer.setDataSource(item.path);
                      mediaPlayer.prepare();
                      mediaPlayer.setLooping(singleLoop);

                      int savedPos = prefs.getInt("pos_" + item.path, 0);
                      if (savedPos > 0 && savedPos < (mediaPlayer.getDuration() - 2000)) {
                          mediaPlayer.seekTo(savedPos);
                      } else {
                          savedPos = 0;
                      }

                      mediaPlayer.start();
                      isPlaying = true;
                      btnPlayPause.setText("Pause");
                      String titleToDisplay = tagsPrefs.getString(item.path + "_title", item.name);
                      trackStatusView.setText("Playing: " + titleToDisplay);
                      seekBar.setMax(mediaPlayer.getDuration());
                      seekBar.setProgress(savedPos);
                      timeTotal.setText(formatDuration(mediaPlayer.getDuration()));
                      timeCurrent.setText(formatDuration(savedPos));

                      abRepeatState = 0;
                      btnABRepeat.setText("A-B Repeat");

                      prefs.edit()
                              .putString("lastPlayingPath", item.path)
                              .putString("lastPlayingName", titleToDisplay)
                              .apply();
                      updateNotification(item, true);
                      applyVoiceAndSpeed();
                  } catch (Throwable ignored) {}
              }

              private void playNextTrack() {
                  if (displayList.isEmpty()) return;
                  if (currentIndex >= 0 && currentIndex < displayList.size() - 1) {
                      playAudioAtIndex(currentIndex + 1);
                  } else {
                      playAudioAtIndex(0);
                  }
              }

              private void playPreviousTrack() {
                  if (displayList.isEmpty()) return;
                  if (currentIndex > 0) {
                      playAudioAtIndex(currentIndex - 1);
                  } else {
                      playAudioAtIndex(0);
                  }
              }

              private void togglePlayPause() {
                  if (mediaPlayer == null) return;
                  try {
                      if (mediaPlayer.isPlaying()) {
                          mediaPlayer.pause();
                          try { if (echoPlayer != null && echoPlayer.isPlaying()) echoPlayer.pause(); } catch (Throwable ignored) {}
                          isPlaying = false;
                          btnPlayPause.setText("Play");
                          if (currentIndex >= 0 && currentIndex < displayList.size()) {
                              updateNotification(displayList.get(currentIndex), false);
                              prefs.edit().putInt("pos_" + displayList.get(currentIndex).path,
                                      mediaPlayer.getCurrentPosition()).apply();
                          }
                      } else {
                          if (currentIndex == -1 && !displayList.isEmpty()) {
                              playAudioAtIndex(0);
                          } else {
                              mediaPlayer.start();
                              applyVoiceAndSpeed();
                              isPlaying = true;
                              btnPlayPause.setText("Pause");
                              if (currentIndex >= 0 && currentIndex < displayList.size()) {
                                  AudioItem item = displayList.get(currentIndex);
                                  trackStatusView.setText("Playing: " + tagsPrefs.getString(item.path + "_title", item.name));
                                  updateNotification(item, true);
                              }
                          }
                      }
                  } catch (Throwable ignored) {}
              }

              private void seekAndUpdate(int change) {
                  try {
                      if (mediaPlayer == null) return;
                      int dur = mediaPlayer.getDuration();
                      if (dur <= 0) return;
                      int newPos = Math.max(0, Math.min(dur, mediaPlayer.getCurrentPosition() + change));
                      mediaPlayer.seekTo(newPos);
                      seekBar.setProgress(newPos);
                      timeCurrent.setText(formatDuration(newPos));
                      if (isPlaying) applyVoiceAndSpeed();
                      if (currentIndex >= 0 && currentIndex < displayList.size()) {
                          prefs.edit().putInt("pos_" + displayList.get(currentIndex).path, newPos).apply();
                      }
                  } catch (Throwable ignored) {}
              }

              // SD Card Detection (Android 10+ Compatible)
              private String getSdCardPath() {
                  String sdPath = null;
                  try {
                      File[] files = ctx.getExternalFilesDirs(null);
                      if (files != null && files.length > 1) {
                          Pattern p = Pattern.compile("^(/storage/[^/]+)");
                          for (File f : files) {
                              if (f != null) {
                                  Matcher m = p.matcher(f.getAbsolutePath());
                                  if (m.find()) {
                                      String sdRoot = m.group(1);
                                      if (sdRoot != null && !sdRoot.contains("emulated") && !sdRoot.contains("self")) {
                                          File testDir = new File(sdRoot);
                                          if (testDir.exists() && testDir.canRead()) {
                                              sdPath = sdRoot;
                                              break;
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  } catch (Throwable ignored) {}

                  if (sdPath == null) {
                      try {
                          File storageDir = new File("/storage");
                          if (storageDir.exists()) {
                              File[] dirs = storageDir.listFiles();
                              if (dirs != null) {
                                  for (File d : dirs) {
                                      String name = d.getName();
                                      if (!"emulated".equals(name) && !"self".equals(name)
                                              && d.isDirectory() && d.canRead()) {
                                          sdPath = d.getAbsolutePath();
                                          break;
                                      }
                                  }
                              }
                          }
                      } catch (Throwable ignored) {}
                  }
                  return sdPath;
              }

              private boolean isAudioFileName(String name) {
                  String lower = name.toLowerCase(Locale.ROOT);
                  return lower.endsWith(".mp3") || lower.endsWith(".opus") || lower.endsWith(".m4a")
                          || lower.endsWith(".wav") || lower.endsWith(".ogg") || lower.endsWith(".aac")
                          || lower.endsWith(".amr");
              }

              private void showFileBrowser(String dirPath) {
                  File f = new File(dirPath);
                  if (!f.exists() || !f.isDirectory()) {
                      Toast.makeText(ctx, "Folder not found or access denied", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  String rootInternal = Environment.getExternalStorageDirectory().getAbsolutePath();
                  String sdPath = getSdCardPath();
                  boolean isRoot = dirPath.equals(rootInternal) || (sdPath != null && dirPath.equals(sdPath));

                  File[] files = null;
                  try { files = f.listFiles(); } catch (Throwable ignored) {}

                  List<BrowserItem> list = new ArrayList<>();
                  if (files != null) {
                      for (File file : Arrays.asList(files)) {
                          String name = file.getName();
                          if (!name.startsWith(".")) {
                              list.add(new BrowserItem(name, file.getAbsolutePath(),
                                      file.isDirectory(), false, file.lastModified()));
                          }
                      }
                  }

                  Comparator<BrowserItem> comp;
                  if ("Title (Ascending)".equals(currentSortOrder) || "Name (A to Z)".equals(currentSortOrder)) {
                      comp = (a, b) -> (a.isDir != b.isDir) ? (a.isDir ? -1 : 1)
                              : a.name.toLowerCase(Locale.ROOT).compareTo(b.name.toLowerCase(Locale.ROOT));
                  } else if ("Title (Descending)".equals(currentSortOrder) || "Name (Z to A)".equals(currentSortOrder)) {
                      comp = (a, b) -> (a.isDir != b.isDir) ? (a.isDir ? -1 : 1)
                              : b.name.toLowerCase(Locale.ROOT).compareTo(a.name.toLowerCase(Locale.ROOT));
                  } else if ("Date (Oldest First)".equals(currentSortOrder)) {
                      comp = (a, b) -> (a.isDir != b.isDir) ? (a.isDir ? -1 : 1)
                              : Long.compare(a.dateAdded, b.dateAdded);
                  } else {
                      comp = (a, b) -> (a.isDir != b.isDir) ? (a.isDir ? -1 : 1)
                              : Long.compare(b.dateAdded, a.dateAdded);
                  }
                  Collections.sort(list, comp);

                  final List<String> finalNames = new ArrayList<>();
                  final List<BrowserItem> finalList = new ArrayList<>();
                  if (!isRoot) {
                      finalNames.add("Go Back");
                      finalList.add(new BrowserItem("Go Back", f.getParent(), false, true, 0));
                  }
                  for (BrowserItem v : list) {
                      finalNames.add(v.name);
                      finalList.add(v);
                  }

                  ListView lv = new ListView(ctx);
                  lv.setAdapter(new ArrayAdapter<>(ctx, android.R.layout.simple_list_item_1, finalNames));

                  AlertDialog.Builder builder = new AlertDialog.Builder(ctx);
                  builder.setTitle("0".equals(f.getName()) ? "Internal Storage" : f.getName());
                  builder.setView(lv);

                  if (fileBrowserDialog != null) fileBrowserDialog.dismiss();
                  fileBrowserDialog = builder.create();
                  fileBrowserDialog.show();

                  final File[] siblingFiles = files;
                  lv.setOnItemClickListener((parent, view, position, id) -> {
                      BrowserItem selected = finalList.get(position);
                      if (selected.isGoBack) {
                          if (selected.path != null && selected.path.length() >= 8) {
                              showFileBrowser(selected.path);
                          }
                      } else if (selected.isDir) {
                          showFileBrowser(selected.path);
                      } else {
                          if (isAudioFileName(selected.name)) {
                              if (currentIndex >= 0 && currentIndex < displayList.size() && mediaPlayer != null) {
                                  try {
                                      prefs.edit().putInt("pos_" + displayList.get(currentIndex).path,
                                              mediaPlayer.getCurrentPosition()).apply();
                                  } catch (Throwable ignored) {}
                              }
                              List<AudioItem> siblings = new ArrayList<>();
                              if (siblingFiles != null) {
                                  for (File sibling : siblingFiles) {
                                      if (!sibling.isDirectory() && isAudioFileName(sibling.getName())) {
                                          siblings.add(new AudioItem(sibling.getName(), sibling.getAbsolutePath(),
                                                  sibling.lastModified(), sibling.length(), 0));
                                      }
                                  }
                              }
                              Collections.sort(siblings, (a, b) ->
                                      a.name.toLowerCase(Locale.ROOT).compareTo(b.name.toLowerCase(Locale.ROOT)));

                              currentFolderFilter = f.getAbsolutePath();
                              showFavoritesOnly = false;
                              showRecentOnly = false;
                              currentPlaylistFilter = null;
                              showTrashOnly = false;
                              currentIndex = -1;
                              refreshListView();
                              if (displayList.isEmpty()) {
                                  displayList = siblings;
                                  renderDisplayList();
                              }

                              int foundIdx = 0;
                              for (int idx = 0; idx < displayList.size(); idx++) {
                                  if (selected.path.equals(displayList.get(idx).path)) {
                                      foundIdx = idx;
                                      break;
                                  }
                              }
                              playAudioAtIndex(foundIdx);
                              if (fileBrowserDialog != null) fileBrowserDialog.dismiss();
                          } else {
                              Toast.makeText(ctx, "This is not an audio file", Toast.LENGTH_SHORT).show();
                          }
                      }
                  });
              }

              private void showStorageSelectorDialog() {
                  if (Build.VERSION.SDK_INT >= 30 && !Environment.isExternalStorageManager()) {
                      try {
                          Intent intent = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);
                          intent.setData(Uri.parse("package:" + getPackageName()));
                          startActivity(intent);
                      } catch (Throwable ignored) {}
                      return;
                  }
                  String internalPath = Environment.getExternalStorageDirectory().getAbsolutePath();
                  String sdPath = getSdCardPath();
                  final List<String> options = new ArrayList<>();
                  final List<String> paths = new ArrayList<>();
                  options.add("Internal storage");
                  paths.add(internalPath);

                  if (sdPath != null) {
                      options.add("SD card");
                      paths.add(sdPath);
                  }

                  new AlertDialog.Builder(ctx)
                          .setTitle("Select Storage")
                          .setItems(options.toArray(new String[0]), (dialog, which) -> showFileBrowser(paths.get(which)))
                          .show();
              }

              private long[] getFolderWeight(String name) {
                  Matcher mZeros = Pattern.compile("^(0+)").matcher(name);
                  if (mZeros.find()) {
                      return new long[]{1, mZeros.group(1).length()};
                  }
                  Matcher mNum = Pattern.compile("^([1-9]\\d*)").matcher(name);
                  if (mNum.find()) {
                      try {
                          return new long[]{2, Long.parseLong(mNum.group(1))};
                      } catch (Throwable ignored) {}
                  }
                  return new long[]{3, 0};
              }

              private void showFoldersDialog() {
                  final Map<String, FolderInfo> foldersMap = new HashMap<>();
                  for (AudioItem file : audioList) {
                      String pathStr = file.path;
                      int lastSlash = pathStr.lastIndexOf('/');
                      if (lastSlash > 0) {
                          String fPath = pathStr.substring(0, lastSlash);
                          String fName = getBaseName(fPath);
                          FolderInfo info = foldersMap.get(fPath);
                          if (info == null) {
                              info = new FolderInfo(fName, fPath, 0);
                              foldersMap.put(fPath, info);
                          }
                          info.count++;
                      }
                  }

                  List<String> sortedKeys = new ArrayList<>(foldersMap.keySet());
                  Collections.sort(sortedKeys, (a, b) -> {
                      int isPinnedA = pinnedPrefs.getBoolean(a, false) ? 1 : 0;
                      int isPinnedB = pinnedPrefs.getBoolean(b, false) ? 1 : 0;
                      if (isPinnedA != isPinnedB) return Integer.compare(isPinnedB, isPinnedA);

                      String nameA = foldersMap.get(a).name.toLowerCase(Locale.ROOT);
                      String nameB = foldersMap.get(b).name.toLowerCase(Locale.ROOT);
                      long[] wA = getFolderWeight(nameA);
                      long[] wB = getFolderWeight(nameB);
                      if (wA[0] != wB[0]) return Long.compare(wA[0], wB[0]);
                      if (wA[0] == 1 && wA[1] != wB[1]) return Long.compare(wB[1], wA[1]);
                      if (wA[0] == 2 && wA[1] != wB[1]) return Long.compare(wA[1], wB[1]);
                      return nameA.compareTo(nameB);
                  });

                  final List<String> folderPaths = new ArrayList<>();
                  final List<String> folderNames = new ArrayList<>();
                  folderPaths.add("ALL");
                  folderNames.add("All Audio Files");
                  for (String path : sortedKeys) {
                      folderPaths.add(path);
                      String prefix = pinnedPrefs.getBoolean(path, false) ? "📌 " : "";
                      FolderInfo info = foldersMap.get(path);
                      folderNames.add(prefix + info.name + " (" + info.count + ")");
                  }

                  AlertDialog.Builder builder = new AlertDialog.Builder(ctx);
                  builder.setTitle("Select Folder");
                  ListView flistView = new ListView(ctx);
                  flistView.setAdapter(new ArrayAdapter<>(ctx, android.R.layout.simple_list_item_1, folderNames));
                  builder.setView(flistView);

                  final AlertDialog folderDialog = builder.create();

                  flistView.setOnItemClickListener((parent, view, position, id) -> {
                      if (currentIndex >= 0 && currentIndex < displayList.size() && mediaPlayer != null) {
                          try {
                              prefs.edit().putInt("pos_" + displayList.get(currentIndex).path,
                                      mediaPlayer.getCurrentPosition()).apply();
                          } catch (Throwable ignored) {}
                      }
                      currentFolderFilter = folderPaths.get(position);
                      currentIndex = -1;
                      showFavoritesOnly = false;
                      showRecentOnly = false;
                      currentPlaylistFilter = null;
                      showTrashOnly = false;
                      refreshListView();
                      Toast.makeText(ctx, "Folder: " + folderNames.get(position), Toast.LENGTH_SHORT).show();
                      folderDialog.dismiss();
                  });

                  flistView.setOnItemLongClickListener((parent, view, position, id) -> {
                      if (position == 0) return true;
                      final String path = folderPaths.get(position);
                      final boolean isPinned = pinnedPrefs.getBoolean(path, false);
                      String[] options = {isPinned ? "Unpin Folder" : "Pin Folder", "Rename Folder"};

                      new AlertDialog.Builder(ctx)
                              .setItems(options, (d, w) -> {
                                  if (w == 0) {
                                      if (isPinned) {
                                          pinnedPrefs.edit().remove(path).apply();
                                          Toast.makeText(ctx, "Unpinned", Toast.LENGTH_SHORT).show();
                                      } else {
                                          pinnedPrefs.edit().putBoolean(path, true).apply();
                                          Toast.makeText(ctx, "Pinned to top", Toast.LENGTH_SHORT).show();
                                      }
                                      folderDialog.dismiss();
                                      btnFolders.performClick();
                                  } else if (w == 1) {
                                      EditText renameInput = new EditText(ctx);
                                      renameInput.setText(foldersMap.get(path).name);
                                      new AlertDialog.Builder(ctx)
                                              .setTitle("Rename Folder")
                                              .setView(renameInput)
                                              .setPositiveButton("Save", (d2, w2) -> {
                                                  String newName = renameInput.getText().toString();
                                                  if (!newName.isEmpty()) {
                                                      File oldFile = new File(path);
                                                      File newFile = new File(oldFile.getParent(), newName);
                                                      if (oldFile.renameTo(newFile)) {
                                                          rescanPath(oldFile.getAbsolutePath());
                                                          rescanPath(newFile.getAbsolutePath());
                                                          Toast.makeText(ctx, "Folder Renamed! Scanning...", Toast.LENGTH_SHORT).show();
                                                          folderDialog.dismiss();
                                                          scanAudioFiles();
                                                      } else {
                                                          Toast.makeText(ctx, "Rename failed. Storage permission required.", Toast.LENGTH_LONG).show();
