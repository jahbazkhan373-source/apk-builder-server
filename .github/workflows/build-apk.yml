                          Toast.makeText(ctx, "Showing Trash Bin", Toast.LENGTH_SHORT).show();
                      } else {
                          Toast.makeText(ctx, "Showing All Files", Toast.LENGTH_SHORT).show();
                      }
                      btnTrash.setText(showTrashOnly ? "Trash Bin (Active)" : "Trash Bin");
                      btnTrash.setBackground(makeButtonDrawable(
                              showTrashOnly ? colorPrimary : colorChip,
                              showTrashOnly ? colorPrimaryDark : colorCardPressed,
                              showTrashOnly ? colorAccent : colorBorder, 12));
                      btnTrash.setTextColor(showTrashOnly ? Color.WHITE : colorTextMain);
                      refreshListView();
                  });
                  innerLayout.addView(btnTrash);

                  Button btnEqPresets = createDialogMenuButton("EQ Presets", colorChip, colorCardPressed, colorBorder, colorTextMain);
                  btnEqPresets.setOnClickListener(v -> showEqPresets());
                  innerLayout.addView(btnEqPresets);

                  Button btnVolumeBoost = createDialogMenuButton("Volume Boost", colorChip, colorCardPressed, colorBorder, colorTextMain);
                  btnVolumeBoost.setOnClickListener(v -> {
                      final String[] options = {"Normal (Off)", "Boost 50%", "Boost 100%", "Boost 150%"};
                      final int[] values = {0, 5, 10, 15};
                      themedDialog()
                              .setTitle("Volume Boost")
                              .setItems(options, (d, w) -> {
                                  MediaPlaybackService.volumeBoostLevel = values[w];
                                  prefs.edit().putInt("volBoost", MediaPlaybackService.volumeBoostLevel).apply();
                                  if (MediaPlaybackService.isPlaying) MediaPlaybackService.applyVoiceAndSpeed();
                                  Toast.makeText(ctx, "Volume Boost: " + options[w], Toast.LENGTH_SHORT).show();
                              })
                              .show();
                  });
                  innerLayout.addView(btnVolumeBoost);

                  final Button btnSkipTime = createDialogMenuButton(getSkipText(), colorChip, colorCardPressed, colorBorder, colorTextMain);
                  btnSkipTime.setOnClickListener(v -> {
                      int sd = MediaPlaybackService.skipDuration;
                      if (sd == 5000) sd = 10000;
                      else if (sd == 10000) sd = 20000;
                      else if (sd == 20000) sd = 30000;
                      else if (sd == 30000) sd = 60000;
                      else if (sd == 60000) sd = 120000;
                      else if (sd == 120000) sd = 300000;
                      else if (sd == 300000) sd = 5000;
                      else sd = 10000;
                      MediaPlaybackService.skipDuration = sd;
                      btnSkipTime.setText(getSkipText());
                      prefs.edit().putInt("skipDuration", sd).apply();
                      String msg;
                      if (sd == 300000) msg = "Saved 5 minutes";
                      else if (sd == 60000) msg = "Saved 1 minute";
                      else if (sd == 120000) msg = "Saved 2 minutes";
                      else msg = "Saved " + (sd / 1000) + " seconds";
                      Toast.makeText(ctx, msg, Toast.LENGTH_SHORT).show();
                  });
                  innerLayout.addView(btnSkipTime);

                  final CheckBox chkSingleLoop = new CheckBox(ctx);
                  chkSingleLoop.setText("Repeat Current Track");
                  chkSingleLoop.setTextColor(colorTextMain);
                  chkSingleLoop.setTextSize(14);
                  chkSingleLoop.setChecked(MediaPlaybackService.singleLoop);
                  chkSingleLoop.setPadding(dp(8), dp(10), dp(8), dp(10));
                  chkSingleLoop.setOnClickListener(v -> {
                      MediaPlaybackService.singleLoop = chkSingleLoop.isChecked();
                      try { MediaPlaybackService.mediaPlayer.setLooping(MediaPlaybackService.singleLoop); } catch (Throwable ignored) {}
                      prefs.edit().putBoolean("singleLoop", MediaPlaybackService.singleLoop).apply();
                      Toast.makeText(ctx, "Repeat settings auto-saved", Toast.LENGTH_SHORT).show();
                  });
                  innerLayout.addView(chkSingleLoop);

                  Button btnContact = createDialogMenuButton("Contact Developer on WhatsApp", colorChip, colorCardPressed, colorBorder, colorTextMain);
                  btnContact.setOnClickListener(v -> openLink("https://wa.me/923041011727"));
                  innerLayout.addView(btnContact);

                  Button btnChannel = createDialogMenuButton("Join WhatsApp Channel", colorChip, colorCardPressed, colorBorder, colorTextMain);
                  btnChannel.setOnClickListener(v -> openLink("https://whatsapp.com/channel/0029Vb5y8QCEwEk1OkHev10x"));
                  innerLayout.addView(btnChannel);

                  Button btnFeedback = createDialogMenuButton("Send Feedback", colorChip, colorCardPressed, colorBorder, colorTextMain);
                  btnFeedback.setOnClickListener(v -> openFeedbackDialog());
                  innerLayout.addView(btnFeedback);

                  Button btnCheckUpdate = createDialogMenuButton("Check for Updates", colorPrimary, colorPrimaryDark, colorAccent, Color.WHITE);
                  btnCheckUpdate.setOnClickListener(v -> checkForUpdates(true));
                  innerLayout.addView(btnCheckUpdate);

                  Button btnAbout = createDialogMenuButton("About & Support", colorChip, colorCardPressed, colorBorder, colorTextMain);
                  btnAbout.setOnClickListener(v -> themedDialog()
                          .setTitle("About & Support")
                          .setMessage("App Name: MJ Audio Player\nVersion: " + UpdateConfig.VERSION_NAME
                                  + " (Build " + UpdateConfig.BUILD_NUMBER + ")"
                                  + "\nDeveloper: Jahbaz hijbani\n\nFeatures:\n- Dark & Light Mode Theme\n- Audio Speed & 28 Voice FX\n- Smart Folder System\n- Full Lock Screen & Notification Controls\n- Internal & SD Card Browser\n- Auto Update via GitHub Releases")
                          .setPositiveButton("OK", null)
                          .show());
                  innerLayout.addView(btnAbout);

                  settingsBuilder.setView(layout);
                  settingsBuilder.setNegativeButton("Close", null);
                  dlgRef[0] = settingsBuilder.create();
                  dlgRef[0].show();
              }
          }
          EOF

      - name: Generate or Load Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > app/release.keystore
            echo "Loaded permanent Release Keystore from GitHub Secrets."
          else
            STORE_PASS="${KEYSTORE_PASSWORD:-MJAud1oReleaseKey2026}"
            ALIAS_NAME="${KEY_ALIAS:-mj_audio_key}"
            KEY_PASS="${KEY_PASSWORD:-MJAud1oReleaseKey2026}"
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias "$ALIAS_NAME" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=MJ Audio Player, OU=Mobile, O=Jahbaz Hijbani, L=DG Khan, ST=Punjab, C=PK"
            echo "Generated new Release Keystore."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "MJ-Audio-Player-v${APP_VERSION_NAME}-Release.apk"

      - name: Verify Release APK Signature
        run: |
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name "apksigner" 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "MJ-Audio-Player-v${APP_VERSION_NAME}-Release.apk"
          else
            keytool -printcert -jarfile "MJ-Audio-Player-v${APP_VERSION_NAME}-Release.apk"
          fi

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mj-audio-player-signed-release
          path: MJ-Audio-Player-v${{ env.APP_VERSION_NAME }}-Release.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}-build-${{ github.run_number }}
          name: MJ Audio Player v${{ env.APP_VERSION_NAME }} (Build ${{ github.run_number }})
          body: |
            ### MJ Audio Player v${{ env.APP_VERSION_NAME }} (Build ${{ github.run_number }})
            - **Developer:** Jahbaz Hijbani
            - **Package:** `com.mjaudio.player`
            - **What's New:** Fixed Lock Screen & Notification Controls (Prev, Rewind, Play/Pause, Forward, Next, Close), 4-Layer SD Card Detection, Encrypted Feedback Secrets, Dark & Light Mode
            - **Core Features:** Auto Update Checker, Foreground Media Service, Custom App Icon, 28 Voice FX, Custom 5-Band EQ, A-B Repeat, Sleep Timer
          files: MJ-Audio-Player-v${{ env.APP_VERSION_NAME }}-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
