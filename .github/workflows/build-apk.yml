                  btnGoTo.setLayoutParams(btnGoToParams);
                  extraControlsRow.addView(btnGoTo);

                  btnABRepeat = new Button(ctx);
                  btnABRepeat.setText("A-B Repeat");
                  btnABRepeat.setPadding(10, 0, 10, 0);
                  btnABRepeat.setTextSize(12);
                  LinearLayout.LayoutParams btnABParams = new LinearLayout.LayoutParams(-2, -2);
                  btnABParams.setMargins(5, 0, 5, 0);
                  btnABRepeat.setLayoutParams(btnABParams);
                  extraControlsRow.addView(btnABRepeat);

                  bottomControlsContainer.addView(extraControlsRow);

                  LinearLayout controlsLayout = new LinearLayout(ctx);
                  controlsLayout.setOrientation(LinearLayout.HORIZONTAL);
                  controlsLayout.setLayoutParams(new LinearLayout.LayoutParams(-1, -2));
                  controlsLayout.setGravity(Gravity.CENTER);

                  Button btnPrev = createControlButton("Prev");
                  Button btnRewind = createControlButton("Rewind");
                  btnPlayPause = createControlButton(isPlaying ? "Pause" : "Play");
                  Button btnForward = createControlButton("Forward");
