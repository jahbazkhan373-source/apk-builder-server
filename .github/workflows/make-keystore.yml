name: Make Keystore
on:
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -keystore mj_release.keystore -alias mj_audio_key -keyalg RSA -keysize 2048 -validity 10000 -storepass MyPass12345 -keypass MyPass12345 -dname "CN=MJ Audio Player, OU=Mobile, O=Jahbaz Hijbani, L=DG Khan, ST=Punjab, C=PK"
          base64 -w 0 mj_release.keystore > keystore_base64.txt
      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: my-keystore
          path: |
            mj_release.keystore
            keystore_base64.txt