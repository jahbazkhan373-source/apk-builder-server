                  Button btn = new Button(ctx);
                  btn.setText(text);
                  btn.setTextSize(10);
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(0, -2, 1.0f);
                  params.setMargins(2, 5, 2, 5);
                  btn.setLayoutParams(params);
                  return btn;
              }

              private void setupAudioFocus() {
                  try {
                      AudioManager audioManager = (AudioManager) ctx.getSystemService(Context.AUDIO_SERVICE);
                      if (audioManager != null) {
                          audioManager.requestAudioFocus(focusChange -> {
                              try {
                                  if (focusChange == AudioManager.AUDIOFOCUS_LOSS
                                          || focusChange == AudioManager.AUDIOFOCUS_LOSS_TRANSIENT) {
                                      if (mediaPlayer != null && mediaPlayer.isPlaying()) {
                                          btnPlayPause.performClick();
                                      }
                                  }
                              } catch (Throwable ignored) {}
                          }, AudioManager.STREAM_MUSIC, AudioManager.AUDIOFOCUS_GAIN);
                      }
                  } catch (Throwable ignored) {}
              }

              private void registerNotificationReceiver() {
                  notificationReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          try {
                              if (intent == null || intent.getAction() == null) return;
                              String action = intent.getAction();
                              if ("JAHBAZ_ACTION_PREV".equals(action)) {
                                  playPreviousTrack();
                              } else if ("JAHBAZ_ACTION_REWIND".equals(action)) {
                                  seekAndUpdate(-skipDuration);
                              } else if ("JAHBAZ_ACTION_PLAY".equals(action)) {
                                  btnPlayPause.performClick();
                              } else if ("JAHBAZ_ACTION_FORWARD".equals(action)) {
                                  seekAndUpdate(skipDuration);
                              } else if ("JAHBAZ_ACTION_NEXT".equals(action)) {
                                  playNextTrack();
                              } else if ("JAHBAZ_ACTION_CLOSE".equals(action)) {
                                  try {
                                      if (mediaPlayer != null) {
                                          if (mediaPlayer.isPlaying()) mediaPlayer.stop();
                                          mediaPlayer.reset();
                                      }
                                      stopEchoPlayer();
                                      isPlaying = false;
                                      btnPlayPause.setText("Play");
                                      trackStatusView.setText("Playback Stopped");
                                      NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                                      if (nm != null) nm.cancel(111);
                                      if (mediaSession != null) {
                                          mediaSession.setActive(false);
                                      }
                                  } catch (Throwable ignored) {}
                              }
                          } catch (Throwable ignored) {}
                      }
                  };

                  IntentFilter filter = new IntentFilter();
                  filter.addAction("JAHBAZ_ACTION_PREV");
                  filter.addAction("JAHBAZ_ACTION_REWIND");
                  filter.addAction("JAHBAZ_ACTION_PLAY");
                  filter.addAction("JAHBAZ_ACTION_FORWARD");
                  filter.addAction("JAHBAZ_ACTION_NEXT");
                  filter.addAction("JAHBAZ_ACTION_CLOSE");
                  try {
                      if (Build.VERSION.SDK_INT >= 33) {
                          ctx.registerReceiver(notificationReceiver, filter, Context.RECEIVER_NOT_EXPORTED);
                      } else {
                          ctx.registerReceiver(notificationReceiver, filter);
                      }
                  } catch (Throwable ignored) {}
              }

              private void setupMediaPlayerCompletion() {
                  mediaPlayer.setOnCompletionListener(mp -> {
                      stopEchoPlayer();
                      if (currentIndex >= 0 && currentIndex < displayList.size()) {
                          prefs.edit().putInt("pos_" + displayList.get(currentIndex).path, 0).apply();
                      }
                      if (singleLoop) {
                          playAudioAtIndex(currentIndex);
                      } else if (currentIndex >= 0 && currentIndex < displayList.size() - 1) {
                          playAudioAtIndex(currentIndex + 1);
                      } else {
                          isPlaying = false;
                          btnPlayPause.setText("Play");
                          trackStatusView.setText("Playback Finished");
                          if (currentIndex >= 0 && currentIndex < displayList.size()) {
                              updateNotification(displayList.get(currentIndex), false);
                          }
                      }
                  });
              }

              private void startProgressUpdater() {
                  updateRunnable = new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if (mediaPlayer != null && mediaPlayer.isPlaying()) {
                                  int current = mediaPlayer.getCurrentPosition();
                                  if (!isUserSeeking) {
                                      seekBar.setProgress(current);
                                      timeCurrent.setText(formatDuration(current));
                                  }

                                  // A-B Repeat Logic
                                  if (abRepeatState == 2 && current >= abPointB) {
                                      mediaPlayer.seekTo(abPointA);
                                      seekBar.setProgress(abPointA);
                                      timeCurrent.setText(formatDuration(abPointA));
                                  }

                                  if (currentIndex >= 0 && currentIndex < displayList.size()) {
                                      prefs.edit().putInt("pos_" + displayList.get(currentIndex).path, current).apply();
                                  }
                              }
                          } catch (Throwable ignored) {}
                          updateHandler.postDelayed(this, 250);
                      }
                  };
                  updateHandler.postDelayed(updateRunnable, 250);
              }

              @Override
              public void onBackPressed() {
                  if (isPlaying && backgroundPlay) {
                      moveTaskToBack(true);
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if (updateRunnable != null) {
                      updateHandler.removeCallbacks(updateRunnable);
                  }
                  if (sleepTimerRunnable != null) {
                      sleepTimerHandler.removeCallbacks(sleepTimerRunnable);
                  }
                  try {
                      if (notificationReceiver != null) {
                          ctx.unregisterReceiver(notificationReceiver);
                      }
                  } catch (Throwable ignored) {}
              }

              private void rescanPath(String filePath) {
                  try {
                      MediaScannerConnection.scanFile(ctx, new String[]{filePath}, null, null);
                  } catch (Throwable ignored) {}
              }

              private void stopEchoPlayer() {
                  try {
                      if (echoPlayer != null) {
                          if (echoPlayer.isPlaying()) echoPlayer.stop();
                          echoPlayer.reset();
                          echoPlayer.release();
                          echoPlayer = null;
                      }
                  } catch (Throwable ignored) {}
              }

              private void syncEchoPlayer(int delayMs, float vol, float speed, float pitch) {
                  if (delayMs <= 0) {
                      stopEchoPlayer();
                      return;
                  }
                  try {
                      if (mediaPlayer == null || !mediaPlayer.isPlaying()
                              || currentIndex < 0 || currentIndex >= displayList.size()) {
                          stopEchoPlayer();
                          return;
                      }
                      AudioItem item = displayList.get(currentIndex);
                      if (echoPlayer == null) {
                          echoPlayer = new MediaPlayer();
                          echoPlayer.setDataSource(item.path);
                          echoPlayer.prepare();
                      }
                      echoPlayer.setLooping(singleLoop);
                      echoPlayer.setVolume(vol, vol);
                      int targetPos = Math.max(0, mediaPlayer.getCurrentPosition() - delayMs);
                      echoPlayer.seekTo(targetPos);
                      if (!echoPlayer.isPlaying()) {
                          echoPlayer.start();
                      }
                      if (Build.VERSION.SDK_INT >= 23) {
                          PlaybackParams ep = echoPlayer.getPlaybackParams();
                          ep.setSpeed(speed);
                          ep.setPitch(pitch);
                          echoPlayer.setPlaybackParams(ep);
                      }
                  } catch (Throwable ignored) {}
              }

              private PendingIntent createActionPendingIntent(int requestCode, String action) {
                  Intent intent = new Intent(action);
                  intent.setPackage(ctx.getPackageName());
                  int flags = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;
                  return PendingIntent.getBroadcast(ctx, requestCode, intent, flags);
              }

              private void updateNotification(AudioItem item, boolean isPlay) {
                  try {
                      NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm == null) return;
                      Notification.Builder builder = (Build.VERSION.SDK_INT >= 26)
                              ? new Notification.Builder(ctx, "audio_channel")
                              : new Notification.Builder(ctx);

                      PendingIntent piPrev = createActionPendingIntent(1, "JAHBAZ_ACTION_PREV");
                      PendingIntent piRewind = createActionPendingIntent(5, "JAHBAZ_ACTION_REWIND");
                      PendingIntent piPlay = createActionPendingIntent(2, "JAHBAZ_ACTION_PLAY");
                      PendingIntent piForward = createActionPendingIntent(6, "JAHBAZ_ACTION_FORWARD");
                      PendingIntent piNext = createActionPendingIntent(3, "JAHBAZ_ACTION_NEXT");
                      PendingIntent piClose = createActionPendingIntent(4, "JAHBAZ_ACTION_CLOSE");

                      String titleToDisplay = tagsPrefs.getString(item.path + "_title", item.name);

                      builder.setContentTitle(titleToDisplay)
                              .setContentText("MJ Audio Player")
                              .setSmallIcon(android.R.drawable.ic_media_play)
                              .setOngoing(isPlay)
                              .setVisibility(Notification.VISIBILITY_PUBLIC)
                              .addAction(android.R.drawable.ic_media_previous, "Prev", piPrev)
                              .addAction(android.R.drawable.ic_media_rew, "Rewind", piRewind)
                              .addAction(isPlay ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play,
                                      isPlay ? "Pause" : "Play", piPlay)
                              .addAction(android.R.drawable.ic_media_ff, "Forward", piForward)
                              .addAction(android.R.drawable.ic_media_next, "Next", piNext)
                              .addAction(android.R.drawable.ic_menu_close_clear_cancel, "Close", piClose);

                      try {
                          Notification.MediaStyle style = new Notification.MediaStyle();
                          style.setShowActionsInCompactView(1, 2, 3);
                          if (Build.VERSION.SDK_INT >= 21) {
                              if (mediaSession == null) {
                                  mediaSession = new MediaSession(getApplicationContext(), "MJ_Audio_Session");
                                  mediaSession.setActive(true);
                              }
                              style.setMediaSession(mediaSession.getSessionToken());

                              PlaybackState.Builder stateBuilder = new PlaybackState.Builder();
                              int state = isPlay ? PlaybackState.STATE_PLAYING : PlaybackState.STATE_PAUSED;
                              long pos = 0;
                              try {
                                  pos = mediaPlayer.getCurrentPosition();
                              } catch (Throwable ignored) {}
                              stateBuilder.setState(state, pos, currentPlaybackSpeed);
                              stateBuilder.setActions(
                                      PlaybackState.ACTION_PLAY
                                              | PlaybackState.ACTION_PAUSE
                                              | PlaybackState.ACTION_SKIP_TO_NEXT
                                              | PlaybackState.ACTION_SKIP_TO_PREVIOUS
                                              | PlaybackState.ACTION_FAST_FORWARD
                                              | PlaybackState.ACTION_REWIND
                                              | PlaybackState.ACTION_STOP
                              );
                              mediaSession.setPlaybackState(stateBuilder.build());
                          }
                          builder.setStyle(style);
                      } catch (Throwable ignored) {}

                      nm.notify(111, builder.build());
                  } catch (Throwable ignored) {}
              }

