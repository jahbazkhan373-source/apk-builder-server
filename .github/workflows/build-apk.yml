              private void syncUiWithPlayer() {
                  try {
                      btnPlayPause.setText(MediaPlaybackService.isPlaying ? "Pause" : "Play");
                      btnSpeed.setText("Speed: " + MediaPlaybackService.currentPlaybackSpeed + "x");
                      trackStatusView.setText(MediaPlaybackService.lastStatusText);

                      if (MediaPlaybackService.abRepeatState == 1) {
                          btnABRepeat.setText("A-B (A Set)");
                          btnABRepeat.setBackground(makeButtonDrawable(colorAmber, colorAmber, colorAmber, 16));
                          btnABRepeat.setTextColor(Color.BLACK);
                      } else if (MediaPlaybackService.abRepeatState == 2) {
                          btnABRepeat.setText("A-B (Active)");
                          btnABRepeat.setBackground(makeButtonDrawable(colorSuccess, colorSuccess, colorSuccess, 16));
                          btnABRepeat.setTextColor(Color.WHITE);
                      } else {
                          btnABRepeat.setText("A-B Repeat");
                          btnABRepeat.setBackground(makeButtonDrawable(colorChip, colorCardPressed, colorBorder, 16));
                          btnABRepeat.setTextColor(colorTextMain);
                      }

                      if (MediaPlaybackService.mediaPlayer != null && MediaPlaybackService.getCurrentItem() != null) {
                          int dur = MediaPlaybackService.mediaPlayer.getDuration();
                          int pos = MediaPlaybackService.mediaPlayer.getCurrentPosition();
                          if (dur > 0) {
                              seekBar.setMax(dur);
                              timeTotal.setText(formatDuration(dur));
                              if (!isUserSeeking) {
                                  seekBar.setProgress(pos);
                                  timeCurrent.setText(formatDuration(pos));
                              }
                          }
                      }
                      if (audioAdapter != null) {
                          audioAdapter.notifyDataSetChanged();
                      }
                  } catch (Throwable ignored) {}
              }

              private void startUiProgressUpdater() {
                  updateRunnable = new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if (MediaPlaybackService.mediaPlayer != null && MediaPlaybackService.mediaPlayer.isPlaying()) {
                                  int current = MediaPlaybackService.mediaPlayer.getCurrentPosition();
                                  int dur = MediaPlaybackService.mediaPlayer.getDuration();
                                  if (dur > 0 && seekBar.getMax() != dur) {
                                      seekBar.setMax(dur);
                                      timeTotal.setText(formatDuration(dur));
                                  }
                                  if (!isUserSeeking) {
                                      seekBar.setProgress(current);
                                      timeCurrent.setText(formatDuration(current));
                                  }
                              }
                          } catch (Throwable ignored) {}
                          updateHandler.postDelayed(this, 250);
                      }
                  };
                  updateHandler.postDelayed(updateRunnable, 250);
              }

              // ==================== GITHUB RELEASES AUTO-UPDATER ====================

              private void registerUpdateDownloadReceiver() {
                  downloadCompleteReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          if (intent == null) return;
                          long id = intent.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1L);
                          if (id != -1L && id == activeUpdateDownloadId) {
                              activeUpdateDownloadId = -1L;
                              installDownloadedApk(id);
                          }
                      }
                  };
                  IntentFilter filter = new IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE);
                  try {
                      if (Build.VERSION.SDK_INT >= 33) {
                          registerReceiver(downloadCompleteReceiver, filter, Context.RECEIVER_EXPORTED);
                      } else {
                          registerReceiver(downloadCompleteReceiver, filter);
                      }
                  } catch (Throwable ignored) {}
              }

              private void installDownloadedApk(long downloadId) {
                  try {
                      DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                      if (dm == null) return;
                      Uri apkUri = dm.getUriForDownloadedFile(downloadId);
                      if (apkUri != null) {
                          Intent installIntent = new Intent(Intent.ACTION_VIEW);
                          installIntent.setDataAndType(apkUri, "application/vnd.android.package-archive");
                          installIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(installIntent);
                      } else {
                          Toast.makeText(ctx, "Download complete! Open Downloads folder to install.", Toast.LENGTH_LONG).show();
                      }
                  } catch (Throwable e) {
                      Toast.makeText(ctx, "Download complete! Tap notification or check Downloads folder to install.", Toast.LENGTH_LONG).show();
                  }
              }

              private void startApkDownload(String apkUrl, String fileName) {
                  try {
                      DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                      if (dm == null) {
                          openLink(apkUrl);
                          return;
                      }
                      String safeName = (fileName != null && fileName.endsWith(".apk"))
                              ? fileName
                              : "MJ-Audio-Player-Update.apk";
                      DownloadManager.Request req = new DownloadManager.Request(Uri.parse(apkUrl));
                      req.setTitle("MJ Audio Player Update");
                      req.setDescription("Downloading " + safeName);
                      req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      req.setMimeType("application/vnd.android.package-archive");
                      req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, safeName);
                      activeUpdateDownloadId = dm.enqueue(req);
                      Toast.makeText(ctx, "Downloading update... Check notification bar.", Toast.LENGTH_LONG).show();
                  } catch (Throwable e) {
                      openLink(apkUrl);
                  }
              }

              private boolean isNewerRelease(String remoteTag) {
                  if (remoteTag == null || remoteTag.trim().isEmpty()) return false;
                  String clean = remoteTag.trim();
                  if (clean.equalsIgnoreCase(UpdateConfig.CURRENT_TAG)) return false;

                  String remoteVer = clean;
                  int remoteBuild = -1;
                  Matcher mBuild = Pattern.compile("(?i)-build-(\\d+)").matcher(clean);
                  if (mBuild.find()) {
                      try {
                          remoteBuild = Integer.parseInt(mBuild.group(1));
                      } catch (Throwable ignored) {}
                      remoteVer = clean.substring(0, mBuild.start());
                  }
                  remoteVer = remoteVer.replaceAll("^[vV]", "").trim();
                  String localVer = UpdateConfig.VERSION_NAME.replaceAll("^[vV]", "").trim();

                  int verCmp = compareVersions(remoteVer, localVer);
                  if (verCmp > 0) return true;
                  if (verCmp < 0) return false;

                  if (remoteBuild > 0) {
                      return remoteBuild > UpdateConfig.BUILD_NUMBER;
                  }
                  return false;
              }

              private int compareVersions(String v1, String v2) {
                  String[] p1 = v1.split("\\.");
                  String[] p2 = v2.split("\\.");
                  int maxLen = Math.max(p1.length, p2.length);
                  for (int i = 0; i < maxLen; i++) {
                      int n1 = parseLeadingInt(i < p1.length ? p1[i] : "0");
                      int n2 = parseLeadingInt(i < p2.length ? p2[i] : "0");
                      if (n1 != n2) return Integer.compare(n1, n2);
                  }
                  return 0;
              }

              private int parseLeadingInt(String s) {
                  if (s == null) return 0;
                  Matcher m = Pattern.compile("^(\\d+)").matcher(s.trim());
                  if (m.find()) {
                      try {
                          return Integer.parseInt(m.group(1));
                      } catch (Throwable ignored) {}
                  }
                  return 0;
              }

              private void checkForUpdates(final boolean isManual) {
                  if (UpdateConfig.GITHUB_REPO == null || !UpdateConfig.GITHUB_REPO.contains("/")) {
                      if (isManual) {
                          Toast.makeText(ctx, "Update repository not configured.", Toast.LENGTH_SHORT).show();
                      }
                      return;
                  }

                  final ProgressDialog pd;
                  if (isManual) {
                      pd = new ProgressDialog(ctx, getDialogThemeRes());
                      pd.setMessage("Checking for updates...");
                      pd.setCancelable(true);
                      pd.show();
                  } else {
                      pd = null;
                  }

                  new Thread(() -> {
                      int responseCode = -1;
                      String responseBody = null;
                      try {
                          String apiUrl = "https://api.github.com/repos/" + UpdateConfig.GITHUB_REPO + "/releases/latest";
                          URL url = new URL(apiUrl);
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("GET");
                          conn.setConnectTimeout(12000);
                          conn.setReadTimeout(12000);
                          conn.setRequestProperty("Accept", "application/vnd.github+json");
                          conn.setRequestProperty("User-Agent", "MJ-Audio-Player-Android");

                          responseCode = conn.getResponseCode();
                          if (responseCode == 200) {
                              StringBuilder sb = new StringBuilder();
                              try (BufferedReader br = new BufferedReader(
                                      new InputStreamReader(conn.getInputStream(), StandardCharsets.UTF_8))) {
                                  String line;
                                  while ((line = br.readLine()) != null) {
                                      sb.append(line);
                                  }
                              }
                              responseBody = sb.toString();
                          }
                          conn.disconnect();
                      } catch (Throwable ignored) {}

                      final int finalCode = responseCode;
                      final String finalBody = responseBody;
                      runOnUiThread(() -> {
                          if (pd != null) {
                              try { pd.dismiss(); } catch (Throwable ignored) {}
                          }

                          if (finalCode == 200 && finalBody != null) {
                              try {
                                  JSONObject json = new JSONObject(finalBody);
                                  final String tagName = json.optString("tag_name", "");
                                  final String releaseName = json.optString("name", tagName);
                                  final String notes = json.optString("body", "Bug fixes and improvements.");
                                  final String htmlUrl = json.optString("html_url",
                                          "https://github.com/" + UpdateConfig.GITHUB_REPO + "/releases");

                                  String foundApkUrl = null;
                                  String foundApkName = "MJ-Audio-Player-" + tagName + ".apk";
                                  JSONArray assets = json.optJSONArray("assets");
                                  if (assets != null) {
                                      for (int i = 0; i < assets.length(); i++) {
                                          JSONObject asset = assets.optJSONObject(i);
                                          if (asset != null) {
                                              String aName = asset.optString("name", "");
                                              if (aName.toLowerCase(Locale.ROOT).endsWith(".apk")) {
                                                  foundApkUrl = asset.optString("browser_download_url", null);
                                                  foundApkName = aName;
                                                  break;
                                              }
                                          }
                                      }
                                  }

                                  if (isNewerRelease(tagName)) {
                                      final String downloadUrl = foundApkUrl;
                                      final String apkFileName = foundApkName;
                                      String msg = "Installed: v" + UpdateConfig.VERSION_NAME
                                              + " (Build " + UpdateConfig.BUILD_NUMBER + ")"
                                              + "\nLatest: " + releaseName
                                              + "\n\nWhat's New:\n" + notes;

                                      AlertDialog.Builder builder = themedDialog()
                                              .setTitle("New Update Available!")
                                              .setMessage(msg)
                                              .setNegativeButton("Later", null);

                                      if (downloadUrl != null && !downloadUrl.isEmpty()) {
                                          builder.setPositiveButton("Download APK", (d, w) -> startApkDownload(downloadUrl, apkFileName));
                                          builder.setNeutralButton("Open in Browser", (d, w) -> openLink(downloadUrl));
                                      } else {
                                          builder.setPositiveButton("Open Release Page", (d, w) -> openLink(htmlUrl));
                                      }
                                      if (!isFinishing()) {
                                          builder.show();
                                      }
                                  } else if (isManual) {
                                      themedDialog()
                                              .setTitle("Up to Date")
                                              .setMessage("You already have the latest version.\n\nCurrent: v"
                                                      + UpdateConfig.VERSION_NAME + " (Build " + UpdateConfig.BUILD_NUMBER + ")")
                                              .setPositiveButton("OK", null)
                                              .show();
                                  }
                              } catch (Throwable e) {
                                  if (isManual) {
                                      Toast.makeText(ctx, "Error reading update details.", Toast.LENGTH_SHORT).show();
                                  }
                              }
                          } else if (isManual) {
                              if (finalCode == 404) {
                                  Toast.makeText(ctx, "No public release found (ensure GitHub repo is Public).", Toast.LENGTH_LONG).show();
                              } else {
                                  Toast.makeText(ctx, "Could not check updates. Check your internet connection.", Toast.LENGTH_LONG).show();
                              }
                          }
                      });
                  }).start();
              }

              // ==================== PERMISSIONS & MODERN ADAPTIVE UI ====================

              private void requestRequiredPermissions() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      if (!Environment.isExternalStorageManager()) {
                          if (!prefs.getBoolean("askedAllFiles", false)) {
                              prefs.edit().putBoolean("askedAllFiles", true).apply();
                              try {
                                  Intent intent = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);
                                  intent.setData(Uri.parse("package:" + getPackageName()));
                                  startActivity(intent);
                              } catch (Throwable ignored) {}
                          }
                      }
                  }

                  try {
                      if (Build.VERSION.SDK_INT >= 23) {
                          List<String> permsToAsk = new ArrayList<>();
                          if (Build.VERSION.SDK_INT >= 33) {
                              if (checkSelfPermission("android.permission.READ_MEDIA_AUDIO") != PackageManager.PERMISSION_GRANTED) {
                                  permsToAsk.add("android.permission.READ_MEDIA_AUDIO");
                              }
                              if (checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                                  permsToAsk.add("android.permission.POST_NOTIFICATIONS");
                              }
                          } else {
                              if (checkSelfPermission("android.permission.READ_EXTERNAL_STORAGE") != PackageManager.PERMISSION_GRANTED) {
                                  permsToAsk.add("android.permission.READ_EXTERNAL_STORAGE");
                                  permsToAsk.add("android.permission.WRITE_EXTERNAL_STORAGE");
                              }
                          }
                          if (!permsToAsk.isEmpty()) {
                              boolean askedAlready = prefs.getBoolean("StrictPermCheck", false);
                              if (!askedAlready) {
                                  prefs.edit().putBoolean("StrictPermCheck", true).apply();
                                  requestPermissions(permsToAsk.toArray(new String[0]), 1);
                              }
                          }
                      }
                  } catch (Throwable ignored) {}
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == 1) {
                      scanAudioFiles();
                  }
              }

