              private int abPointA = 0;
              private int abPointB = 0;
              private boolean isUserSeeking = false;

              private List<AudioItem> audioList = new ArrayList<>();
              private List<AudioItem> displayList = new ArrayList<>();
              private int currentIndex = -1;
              private boolean isPlaying = false;
              private String currentFolderFilter = "ALL";
              private final int[] customEqBands = new int[]{0, 0, 0, 0, 0};

              // UI elements
              private TextView fileCountView;
              private TextView currentFolderView;
              private LinearLayout searchRowLayout;
              private EditText searchInput;
              private ListView listView;
              private GridView gridView;
              private TextView trackStatusView;
              private TextView timeCurrent;
              private SeekBar seekBar;
              private TextView timeTotal;
              private Button btnFavs;
              private Button btnViewMode;
              private Button btnABRepeat;
              private Button btnPlayPause;
              private Button btnSpeed;
              private Button btnFolders;

              private AlertDialog fileBrowserDialog = null;
              private final Handler updateHandler = new Handler(Looper.getMainLooper());
              private Runnable updateRunnable;
              private final Handler sleepTimerHandler = new Handler(Looper.getMainLooper());
              private Runnable sleepTimerRunnable = null;
              private BroadcastReceiver notificationReceiver;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  ctx = this;

                  prefs = ctx.getSharedPreferences("AudioPlayerProPrefs", Context.MODE_PRIVATE);
                  pinnedPrefs = ctx.getSharedPreferences("PinnedFoldersPrefs", Context.MODE_PRIVATE);
                  favPrefs = ctx.getSharedPreferences("AudioFavPrefs", Context.MODE_PRIVATE);
                  tagsPrefs = ctx.getSharedPreferences("AudioTagsPrefs", Context.MODE_PRIVATE);
                  recentPrefs = ctx.getSharedPreferences("AudioRecentPrefs", Context.MODE_PRIVATE);
                  playlistsPrefs = ctx.getSharedPreferences("AudioPlaylistsPrefs", Context.MODE_PRIVATE);
                  trashPrefs = ctx.getSharedPreferences("AudioTrashPrefs", Context.MODE_PRIVATE);

                  skipDuration = prefs.getInt("skipDuration", 10000);
                  backgroundPlay = prefs.getBoolean("backgroundPlay", true);
                  singleLoop = prefs.getBoolean("singleLoop", false);
                  currentPlaybackSpeed = prefs.getFloat("playbackSpeed", 1.0f);
                  currentSortOrder = prefs.getString("sortOrder", "Date (Newest First)");
                  volumeBoostLevel = prefs.getInt("volBoost", 0);
                  currentEqPreset = prefs.getInt("eqPreset", -1);
                  for (int i = 0; i < 5; i++) {
                      customEqBands[i] = prefs.getInt("custEqBand" + (i + 1), 0);
                  }

                  requestRequiredPermissions();
                  createNotificationChannel();

                  if (mediaPlayer == null) {
                      mediaPlayer = new MediaPlayer();
                      try {
                          mediaPlayer.setWakeMode(getApplicationContext(), PowerManager.PARTIAL_WAKE_LOCK);
                      } catch (Throwable ignored) {}
                  }
                  try {
                      isPlaying = mediaPlayer.isPlaying();
                  } catch (Throwable ignored) {}

                  buildUI();
                  setupAudioFocus();
                  registerNotificationReceiver();
                  setupMediaPlayerCompletion();
                  startProgressUpdater();

                  scanAudioFiles();
              }

              private void requestRequiredPermissions() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      if (!Environment.isExternalStorageManager()) {
                          if (!prefs.getBoolean("askedAllFiles", false)) {
                              prefs.edit().putBoolean("askedAllFiles", true).apply();
                              try {
                                  Intent intent = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);
                                  intent.setData(Uri.parse("package:" + getPackageName()));
                                  startActivity(intent);
                              } catch (Throwable ignored) {}
                          }
                      }
                  }

                  try {
                      if (Build.VERSION.SDK_INT >= 23) {
                          List<String> permsToAsk = new ArrayList<>();
                          if (Build.VERSION.SDK_INT >= 33) {
                              if (checkSelfPermission("android.permission.READ_MEDIA_AUDIO") != PackageManager.PERMISSION_GRANTED) {
                                  permsToAsk.add("android.permission.READ_MEDIA_AUDIO");
                              }
                              if (checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                                  permsToAsk.add("android.permission.POST_NOTIFICATIONS");
                              }
                          } else {
                              if (checkSelfPermission("android.permission.READ_EXTERNAL_STORAGE") != PackageManager.PERMISSION_GRANTED) {
                                  permsToAsk.add("android.permission.READ_EXTERNAL_STORAGE");
                                  permsToAsk.add("android.permission.WRITE_EXTERNAL_STORAGE");
                              }
                          }
                          if (!permsToAsk.isEmpty()) {
                              boolean askedAlready = prefs.getBoolean("StrictPermCheck", false);
                              if (!askedAlready) {
                                  prefs.edit().putBoolean("StrictPermCheck", true).apply();
                                  requestPermissions(permsToAsk.toArray(new String[0]), 1);
                              }
                          }
                      }
                  } catch (Throwable ignored) {}
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == 1) {
                      scanAudioFiles();
                  }
              }

              private void createNotificationChannel() {
                  try {
                      if (Build.VERSION.SDK_INT >= 26) {
                          NotificationChannel channel = new NotificationChannel(
                                  "audio_channel", "MJ Audio Playback", NotificationManager.IMPORTANCE_LOW);
                          NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null) nm.createNotificationChannel(channel);
                      }
                  } catch (Throwable ignored) {}
              }

              private void buildUI() {
                  LinearLayout mainLayout = new LinearLayout(ctx);
                  mainLayout.setOrientation(LinearLayout.VERTICAL);
                  mainLayout.setLayoutParams(new LinearLayout.LayoutParams(-1, -1));
                  mainLayout.setPadding(16, 16, 16, 16);

                  TextView titleView = new TextView(ctx);
                  titleView.setText("MJ Audio Player");
                  titleView.setTextSize(22);
                  titleView.setTextColor(0xFF1E88E5);
                  titleView.setGravity(Gravity.CENTER);
                  mainLayout.addView(titleView);

                  TextView devView = new TextView(ctx);
                  devView.setText("Developer: Jahbaz hijbani");
                  devView.setTextSize(14);
                  devView.setGravity(Gravity.CENTER);
                  devView.setPadding(0, 0, 0, 15);
                  mainLayout.addView(devView);

                  LinearLayout topBarLayout = new LinearLayout(ctx);
                  topBarLayout.setOrientation(LinearLayout.VERTICAL);

                  HorizontalScrollView topButtonScroll = new HorizontalScrollView(ctx);
                  topButtonScroll.setHorizontalScrollBarEnabled(false);
                  LinearLayout topButtonRow = new LinearLayout(ctx);
                  topButtonRow.setOrientation(LinearLayout.HORIZONTAL);

                  Button btnSearchTop = new Button(ctx);
                  btnSearchTop.setText("Search");
                  topButtonRow.addView(btnSearchTop);

                  Button btnAllFiles = new Button(ctx);
                  btnAllFiles.setText("All Files");
                  topButtonRow.addView(btnAllFiles);

                  Button btnSort = new Button(ctx);
                  btnSort.setText("Sort");
                  topButtonRow.addView(btnSort);

                  btnFavs = new Button(ctx);
                  btnFavs.setText("Favorites");
                  topButtonRow.addView(btnFavs);

                  btnViewMode = new Button(ctx);
                  btnViewMode.setText("View: List");
                  topButtonRow.addView(btnViewMode);

                  topButtonScroll.addView(topButtonRow);
                  topBarLayout.addView(topButtonScroll);

                  LinearLayout folderRowLayout = new LinearLayout(ctx);
                  folderRowLayout.setOrientation(LinearLayout.HORIZONTAL);

                  btnFolders = new Button(ctx);
                  btnFolders.setText("Folders");
                  folderRowLayout.addView(btnFolders);

                  Button btnRecent = new Button(ctx);
                  btnRecent.setText("Recent");
                  folderRowLayout.addView(btnRecent);

                  Button btnPlaylists = new Button(ctx);
                  btnPlaylists.setText("Playlists");
                  folderRowLayout.addView(btnPlaylists);

                  topBarLayout.addView(folderRowLayout);

                  fileCountView = new TextView(ctx);
                  fileCountView.setGravity(Gravity.CENTER_VERTICAL);
                  fileCountView.setPadding(20, 10, 0, 0);
                  topBarLayout.addView(fileCountView);

                  currentFolderView = new TextView(ctx);
                  currentFolderView.setText("Current: All Audio Files");
                  currentFolderView.setTextSize(14);
                  currentFolderView.setTextColor(0xFF4CAF50);
                  currentFolderView.setPadding(0, 5, 0, 10);
                  topBarLayout.addView(currentFolderView);

                  mainLayout.addView(topBarLayout);

                  searchRowLayout = new LinearLayout(ctx);
                  searchRowLayout.setOrientation(LinearLayout.HORIZONTAL);
                  searchRowLayout.setVisibility(View.GONE);
                  searchInput = new EditText(ctx);
                  searchInput.setHint("Search...");
                  searchInput.setLayoutParams(new LinearLayout.LayoutParams(0, -2, 1));
                  searchRowLayout.addView(searchInput);
                  Button btnSearchQuery = new Button(ctx);
                  btnSearchQuery.setText("Find");
                  searchRowLayout.addView(btnSearchQuery);
                  mainLayout.addView(searchRowLayout);

                  FrameLayout listContainer = new FrameLayout(ctx);
                  listContainer.setLayoutParams(new LinearLayout.LayoutParams(-1, 0, 1));

                  listView = new ListView(ctx);
                  listView.setLayoutParams(new FrameLayout.LayoutParams(-1, -1));
                  listContainer.addView(listView);

                  gridView = new GridView(ctx);
                  gridView.setNumColumns(2);
                  gridView.setLayoutParams(new FrameLayout.LayoutParams(-1, -1));
                  gridView.setVisibility(View.GONE);
                  listContainer.addView(gridView);

                  mainLayout.addView(listContainer);

                  // Bottom Controls
                  LinearLayout bottomControlsContainer = new LinearLayout(ctx);
                  bottomControlsContainer.setOrientation(LinearLayout.VERTICAL);
                  bottomControlsContainer.setLayoutParams(new LinearLayout.LayoutParams(-1, -2));

                  trackStatusView = new TextView(ctx);
                  trackStatusView.setText("No Audio Selected");
                  trackStatusView.setGravity(Gravity.CENTER);
                  trackStatusView.setPadding(0, 8, 0, 8);
                  bottomControlsContainer.addView(trackStatusView);

                  LinearLayout seekBarLayout = new LinearLayout(ctx);
                  seekBarLayout.setOrientation(LinearLayout.HORIZONTAL);
                  seekBarLayout.setGravity(Gravity.CENTER_VERTICAL);

                  timeCurrent = new TextView(ctx);
                  timeCurrent.setText("00:00");
                  seekBarLayout.addView(timeCurrent);

                  seekBar = new SeekBar(ctx);
                  seekBar.setLayoutParams(new LinearLayout.LayoutParams(0, -2, 1));
                  seekBarLayout.addView(seekBar);

                  timeTotal = new TextView(ctx);
                  timeTotal.setText("00:00");
                  seekBarLayout.addView(timeTotal);

                  bottomControlsContainer.addView(seekBarLayout);

                  LinearLayout extraControlsRow = new LinearLayout(ctx);
                  extraControlsRow.setOrientation(LinearLayout.HORIZONTAL);
                  extraControlsRow.setGravity(Gravity.CENTER);

                  Button btnGoTo = new Button(ctx);
                  btnGoTo.setText("Go To Time");
                  btnGoTo.setPadding(10, 0, 10, 0);
                  btnGoTo.setTextSize(12);
                  LinearLayout.LayoutParams btnGoToParams = new LinearLayout.LayoutParams(-2, -2);
