                      this.dateAdded = dateAdded;
                      this.size = size;
                      this.duration = duration;
                  }
              }

              static class FolderInfo {
                  String name;
                  String path;
                  int count;

                  FolderInfo(String name, String path, int count) {
                      this.name = name;
                      this.path = path;
                      this.count = count;
                  }
              }

              static class BrowserItem {
                  String name;
                  String path;
                  boolean isDir;
                  boolean isGoBack;
                  long dateAdded;

                  BrowserItem(String name, String path, boolean isDir, boolean isGoBack, long dateAdded) {
                      this.name = name;
                      this.path = path;
                      this.isDir = isDir;
                      this.isGoBack = isGoBack;
                      this.dateAdded = dateAdded;
                  }
              }

              // Global persistent audio engine instances
              private static MediaPlayer mediaPlayer;
              private static MediaPlayer echoPlayer;
              private static MediaSession mediaSession;
              private static Equalizer globalEq;
              private static BassBoost globalBass;
              private static Virtualizer globalVirt;
              private static LoudnessEnhancer globalLoudness;

              private Context ctx;
              private SharedPreferences prefs;
              private SharedPreferences pinnedPrefs;
              private SharedPreferences favPrefs;
              private SharedPreferences tagsPrefs;
              private SharedPreferences recentPrefs;
              private SharedPreferences playlistsPrefs;
              private SharedPreferences trashPrefs;

              private int skipDuration = 10000;
              private boolean backgroundPlay = true;
              private boolean singleLoop = false;
              private float currentPlaybackSpeed = 1.0f;
              private String currentVoiceEffect = "Normal";
              private String currentSortOrder = "Date (Newest First)";
              private int volumeBoostLevel = 0;
              private int currentEqPreset = -1;

              private boolean showFavoritesOnly = false;
              private boolean showRecentOnly = false;
              private String currentPlaylistFilter = null;
              private boolean showTrashOnly = false;
              private String currentSearchQuery = "";
