                  bottomControlsContainer.addView(bottomLayout);
                  mainLayout.addView(bottomControlsContainer);

                  setContentView(mainLayout);

                  // Listeners
                  btnSearchTop.setOnClickListener(v -> {
                      if (searchRowLayout.getVisibility() == View.VISIBLE) {
                          searchRowLayout.setVisibility(View.GONE);
                          currentSearchQuery = "";
                          searchInput.setText("");
                          refreshListView();
                      } else {
                          searchRowLayout.setVisibility(View.VISIBLE);
                          searchInput.requestFocus();
                      }
                  });

                  btnSearchQuery.setOnClickListener(v -> {
                      currentSearchQuery = searchInput.getText().toString().toLowerCase(Locale.ROOT).trim();
                      refreshListView();
                  });

                  btnViewMode.setOnClickListener(v -> {
                      isGridView = !isGridView;
                      if (isGridView) {
                          btnViewMode.setText("View: Grid");
                          listView.setVisibility(View.GONE);
                          gridView.setVisibility(View.VISIBLE);
                      } else {
                          btnViewMode.setText("View: List");
                          gridView.setVisibility(View.GONE);
                          listView.setVisibility(View.VISIBLE);
                      }
                  });

                  btnFavs.setOnClickListener(v -> {
                      showFavoritesOnly = !showFavoritesOnly;
                      showRecentOnly = false;
                      currentPlaylistFilter = null;
                      showTrashOnly = false;
                      btnFavs.setText(showFavoritesOnly ? "All Audio" : "Favorites");
                      refreshListView();
                  });

                  btnRecent.setOnClickListener(v -> {
                      showRecentOnly = !showRecentOnly;
                      showFavoritesOnly = false;
                      currentPlaylistFilter = null;
                      showTrashOnly = false;
                      refreshListView();
                  });

                  btnPlaylists.setOnClickListener(v -> showPlaylistsDialog());
                  btnGoTo.setOnClickListener(v -> showGoToTimeDialog());
                  btnABRepeat.setOnClickListener(v -> handleABRepeat());
                  btnSort.setOnClickListener(v -> showSortDialog());
                  btnCustomEq.setOnClickListener(v -> showCustomEqDialog());
                  btnAllFiles.setOnClickListener(v -> showStorageSelectorDialog());
                  btnFolders.setOnClickListener(v -> showFoldersDialog());
                  btnVoice.setOnClickListener(v -> showVoiceEffectsDialog());
                  btnSpeed.setOnClickListener(v -> showSpeedDialog());
                  btnSettings.setOnClickListener(v -> showSettingsDialog());

                  btnPlayPause.setOnClickListener(v -> togglePlayPause());
                  btnPrev.setOnClickListener(v -> playPreviousTrack());
                  btnNext.setOnClickListener(v -> playNextTrack());
                  btnRewind.setOnClickListener(v -> seekAndUpdate(-skipDuration));
                  btnForward.setOnClickListener(v -> seekAndUpdate(skipDuration));

                  AdapterView.OnItemClickListener itemClickListener = (parent, view, position, id) -> playAudioAtIndex(position);
                  listView.setOnItemClickListener(itemClickListener);
                  gridView.setOnItemClickListener(itemClickListener);

                  AdapterView.OnItemLongClickListener itemLongClickListener = (parent, view, position, id) -> onAudioItemLongClick(position);
                  listView.setOnItemLongClickListener(itemLongClickListener);
                  gridView.setOnItemLongClickListener(itemLongClickListener);

                  seekBar.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar sb, int progress, boolean fromUser) {
                          if (fromUser) {
                              timeCurrent.setText(formatDuration(progress));
                          }
                      }

                      @Override
                      public void onStartTrackingTouch(SeekBar sb) {
                          isUserSeeking = true;
                      }

                      @Override
                      public void onStopTrackingTouch(SeekBar sb) {
                          isUserSeeking = false;
                          if (mediaPlayer != null) {
                              try {
                                  int pos = sb.getProgress();
                                  mediaPlayer.seekTo(pos);
                                  timeCurrent.setText(formatDuration(pos));
                                  if (isPlaying) applyVoiceAndSpeed();
                                  if (currentIndex >= 0 && currentIndex < displayList.size()) {
                                      prefs.edit().putInt("pos_" + displayList.get(currentIndex).path, pos).apply();
                                  }
                              } catch (Throwable ignored) {}
                          }
                      }
                  });
              }

              private Button createControlButton(String text) {
                  Button btn = new Button(ctx);
                  btn.setText(text);
                  btn.setTextSize(10);
                  btn.setPadding(4, 8, 4, 8);
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(0, -2, 1.0f);
                  params.setMargins(2, 2, 2, 2);
                  btn.setLayoutParams(params);
                  return btn;
              }

