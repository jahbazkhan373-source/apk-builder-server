              private GradientDrawable makeCardDrawable(int bgColor, int strokeColor, int radiusDp, int strokeWidthDp) {
                  GradientDrawable gd = new GradientDrawable();
                  gd.setShape(GradientDrawable.RECTANGLE);
                  gd.setColor(bgColor);
                  gd.setCornerRadius(dp(radiusDp));
                  if (strokeWidthDp > 0) {
                      gd.setStroke(dp(strokeWidthDp), strokeColor);
                  }
                  return gd;
              }

              private StateListDrawable makeButtonDrawable(int normalBg, int pressedBg, int strokeColor, int radiusDp) {
                  StateListDrawable states = new StateListDrawable();
                  states.addState(new int[]{android.R.attr.state_pressed},
                          makeCardDrawable(pressedBg, strokeColor, radiusDp, 1));
                  states.addState(new int[]{},
                          makeCardDrawable(normalBg, strokeColor, radiusDp, 1));
                  return states;
              }

